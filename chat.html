<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>文本对话 · 创作工作台</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/chat-simple.css" />
  </head>
  <body class="chat-body">
    <div class="chat-shell">
      <header class="topbar chat-topbar">
        <a class="brand brand-link" href="/" aria-label="返回创作工作台">
          <span class="brand-mark" aria-hidden="true">AI</span>
          <span><strong>创作工作台</strong><small>TEXT · IMAGE · VIDEO</small></span>
        </a>
        <div class="topbar-actions">
          <nav class="workspace-tabs" aria-label="工作台切换">
            <a class="workspace-tab" href="/">视频生成</a>
            <a class="workspace-tab" href="/image">图片生成</a>
            <a class="workspace-tab" href="/photo/review">图片标注</a>
            <a class="workspace-tab active" href="/chat">文本对话</a>
            <a class="workspace-tab" href="/settings">设置</a>
          </nav>
        </div>
      </header>
      <main class="chat-main">
        <aside class="conversation-sidebar" aria-label="对话列表">
          <div class="sidebar-heading"><div><span class="eyebrow">CONVERSATIONS</span><h2>你的对话</h2></div><span class="sidebar-count" id="conversationCount">0</span></div>
          <button class="new-chat-button" id="newChatButton" type="button"><span aria-hidden="true">+</span> 新对话</button>
          <nav class="conversation-list" id="conversationList" aria-label="对话列表"></nav>
          <div class="sidebar-note"><span class="status-dot" aria-hidden="true"></span><span>本地保存 · 私密工作区</span></div>
        </aside>
        <section class="conversation-panel" aria-label="文本对话">
          <header class="conversation-header"><div class="conversation-title"><div class="assistant-avatar" aria-hidden="true">✦</div><div><h1>Qwen 对话</h1><p><span class="online-dot" aria-hidden="true"></span>在线 · 创作助手</p></div></div><div class="conversation-tools" aria-label="对话信息"><span class="model-chip">QWEN 3.8</span><span class="header-hint">Enter 发送 · Shift + Enter 换行</span></div></header>
          <div class="message-list" id="messageList" aria-live="polite"></div>
          <form class="composer" id="chatForm"><div class="composer-wrap"><textarea id="chatInput" rows="1" placeholder="写下你的想法，开始一段新对话…" aria-label="输入消息"></textarea><div class="composer-footer"><label class="thinking-toggle" title="勾选后模型先输出推理过程再回答"><input type="checkbox" id="thinkingToggle"> <span aria-hidden="true">✧</span> 深度思考</label><span class="composer-tip">AI 可能会出错，请核对重要信息</span><button id="sendButton" type="submit"><span>发送</span><span class="send-icon" aria-hidden="true">↗</span></button></div></div></form>
        </section>
      </main>
    </div>
    <script src="/chat.js"></script>
  </body>
</html>
