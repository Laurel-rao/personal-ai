<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>精英闯关 · ELITE ARENA — Fluent 浅色流</title>
    <style>
      :root {
        /* Fluent 颜色体系 */
        --primary: #0078d4;
        --primary-hover: #106ebe;
        --primary-active: #005a9e;
        --bg: #ffffff;
        --bg-soft: #f3f2f1;
        --text: #323130;
        --text-body: #605e5c;
        --text-sub: #a19f9d;
        --border: #e1e1e1;
        --border-strong: #8a8886;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; overflow: hidden;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        background:
          radial-gradient(120% 90% at 62% 40%, #ffffff 0%, #f3f2f1 55%, #eaeae8 100%);
        color: var(--text);
      }

      /* 细线网格（浅色版本） */
      .grid {
        position: fixed; inset: 0; pointer-events: none; z-index: 1;
        background-image:
          linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
        background-size: 72px 72px;
        -webkit-mask-image: radial-gradient(120% 120% at 50% 50%, #000 45%, transparent 80%);
                mask-image: radial-gradient(120% 120% at 50% 50%, #000 45%, transparent 80%);
      }

      #wave { position: fixed; inset: 0; z-index: 2; display: block; }

      /* 柔和暗角（浅底用很轻的） */
      .vignette {
        position: fixed; inset: 0; z-index: 3; pointer-events: none;
        background: radial-gradient(120% 120% at 50% 42%, transparent 60%, rgba(180,180,180,0.18) 100%);
      }

      .stage {
        position: fixed; inset: 0; z-index: 4;
        display: flex; align-items: center; justify-content: space-between;
        padding: clamp(32px, 7vw, 96px); gap: 4vw; pointer-events: none;
      }
      .stage > * { pointer-events: auto; }

      .copy { max-width: 46vw; min-width: 320px; }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 12px;
        font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--primary); font-weight: 600; margin-bottom: 26px;
      }
      .eyebrow::before { content: ""; width: 34px; height: 2px; background: var(--primary); border-radius: 2px; }
      h1 {
        margin: 0 0 4px;
        font-size: clamp(44px, 6vw, 88px);
        line-height: 1.05;
        letter-spacing: -0.01em;
        letter-spacing: -0.02em;
        font-weight: 640;
        color: var(--text);
      }
      .title-sub { display: block; margin: 16px 0 22px; font-size: clamp(14px,1.2vw,18px); letter-spacing: 0.02em; color: var(--text-body); font-weight: 500; }
      .desc { max-width: 40ch; margin: 0 0 40px; font-size: clamp(15px,1.2vw,18px); line-height: 1.7; color: var(--text-body); }

      .actions { display: flex; gap: 14px; flex-wrap: wrap; }

      /* Fluent 按钮 */
      .btn {
        appearance: none;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 12px 26px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: all 150ms ease-out;
        outline: none;
      }
      .btn:focus-visible { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--primary); }
      .btn:active { transform: translateY(0) scale(0.97); box-shadow: none; }
      .btn-primary {
        color: #fff;
        background: var(--primary);
        box-shadow: 0 1.6px 3.6px rgba(0,0,0,0.13), 0 0.3px 0.9px rgba(0,0,0,0.1);
      }
      .btn-primary:hover { background: var(--primary-hover); transform: translateY(-0.5px); box-shadow: 0 6.4px 14.4px rgba(0,0,0,0.18), 0 1.2px 3.6px rgba(0,0,0,0.14); }
      .btn-secondary {
        color: var(--text);
        background: #fff;
        border-color: var(--border-strong);
        box-shadow: 0 1.6px 3.6px rgba(0,0,0,0.08), 0 0.3px 0.9px rgba(0,0,0,0.06);
      }
      .btn-secondary:hover { background: #fafafa; border-color: var(--text-sub); transform: translateY(-0.5px); }

      /* 右侧关卡轨迹卡（亚克力材质） */
      .track-side {
        width: clamp(320px, 34vw, 480px);
        aspect-ratio: 1 / 1;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        position: relative;
        background: rgba(255,255,255,0.7);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(0,0,0,0.08);
        border-radius: 16px;
        box-shadow: 0 6.4px 14.4px rgba(0,0,0,0.08), 0 1.2px 3.6px rgba(0,0,0,0.06);
        transition: all 200ms ease-out;
      }
      .track-side:hover { transform: translateY(-2px); border-color: rgba(0,120,212,0.4); box-shadow: 0 12px 28px rgba(0,0,0,0.1), 0 2px 6px rgba(0,0,0,0.06); }
      .rings { position: relative; width: 86%; height: 86%; }
      .ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); border-radius: 50%; }
      .ring-3 { width: 100%; height: 100%; border: 1px solid rgba(0,0,0,0.10); }
      .ring-2 { width: 68%; height: 68%; border: 1px solid rgba(0,0,0,0.10); }
      .ring-1 { width: 34%; height: 34%; border: 1px solid var(--primary); box-shadow: 0 0 22px rgba(0,120,212,0.18); }
      .lane { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed rgba(0,0,0,0.14); }
      .lane-label {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%,-50%) translateY(-45%);
        font-size: 12px; letter-spacing: 0.14em; color: var(--text-sub); font-weight: 600; white-space: nowrap;
      }
      .trophy {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%,-50%);
        width: 40%; aspect-ratio: 1; display: grid; place-items: center;
      }
      .trophy img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.18)); }

      .note { position: fixed; left: 22px; bottom: 22px; z-index: 10; max-width: 30ch; font-size: 11px; line-height: 1.6; color: var(--text-sub); }

      @media (prefers-reduced-motion: reduce) { #wave { visibility: hidden; } }
    </style>
  </head>
  <body>
    <div class="grid" aria-hidden="true"></div>
    <canvas id="wave" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <section class="stage">
      <div class="copy">
        <span class="eyebrow">精英闯关 / ELITE ARENA</span>
        <h1>以题为刃<br />向上闯关</h1>
        <span class="title-sub">Sharpen the mind · Conquer each level</span>
        <p class="desc">在层层设限的关隘中，用每一次思考劈开路径。此刻起，题即为刃，向上，从不回头。</p>
        <div class="actions">
          <button class="btn btn-primary" type="button">开始闯关</button>
          <button class="btn btn-secondary" type="button">查看规则</button>
        </div>
      </div>

      <div class="track-side">
        <div class="rings">
          <div class="ring ring-3"><div class="lane"></div></div>
          <div class="ring ring-2"><div class="lane"></div></div>
          <div class="ring ring-1"></div>
          <div class="lane-label">LEVEL 03</div>
          <div class="trophy">
            <img src="./assets/trophy_fluent.png" alt="关卡核心奖杯" />
          </div>
        </div>
      </div>
    </section>

    <p class="note">Fluent Design 浅色流 · three.js 粒子波浪（本地 vendor 构建，离线可运行）。</p>

    <script src="./vendor/node_modules/three/build/three.min.js"></script>
    <script>
      (function () {
        "use strict";
        var THREE = window.THREE;

        var canvas = document.getElementById("wave");
        var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setClearColor(0xffffff, 0);

        var scene = new THREE.Scene();
        var camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -1, 1);

        function onResize() {
          var w = window.innerWidth, h = window.innerHeight;
          renderer.setSize(w, h, false);
          camera.top = 1; camera.bottom = -1;
          camera.left = -1; camera.right = 1;
          camera.updateProjectionMatrix();
        }
        onResize();
        window.addEventListener("resize", onResize);

        var COUNT = 1600;
        var t = 0;
        var mouse = { x: 0, y: 0, active: 0 };

        // 微软蓝 + 深蓝 + 浅蓝粒子（浅底上清晰但不刺眼）
        var DEEP = new THREE.Color(0x1f4f8f);
        var AZURE = new THREE.Color(0x0078d4);
        var CYAN = new THREE.Color(0x4fa8e0);

        var RING = { x: 0.5, y: 0.05, r: 0.52 };

        var posGeo = new THREE.BufferGeometry();
        var positions = new Float32Array(COUNT * 3);
        var aBase = new Float32Array(COUNT);
        var aBand = new Float32Array(COUNT);
        var aPhase = new Float32Array(COUNT);
        var aSize = new Float32Array(COUNT);

        for (var i = 0; i < COUNT; i++) {
          aBase[i] = Math.random();
          aBand[i] = (Math.random() * 2 - 1) * (0.5 + Math.random() * 0.5);
          aPhase[i] = Math.random() * 6.283;
          aSize[i] = 0.6 + Math.pow(Math.random(), 2.2) * 1.9;
          positions[i * 3 + 0] = 0;
          positions[i * 3 + 1] = 0;
          positions[i * 3 + 2] = 0;
        }
        posGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        posGeo.setAttribute("aBase", new THREE.BufferAttribute(aBase, 1));
        posGeo.setAttribute("aBand", new THREE.BufferAttribute(aBand, 1));
        posGeo.setAttribute("aPhase", new THREE.BufferAttribute(aPhase, 1));
        posGeo.setAttribute("aSize", new THREE.BufferAttribute(aSize, 1));

        var vertexShader = [
          "uniform float uTime;",
          "uniform vec2 uMouse;",
          "uniform float uMouseActive;",
          "uniform float uAspect;",
          "uniform float uAmp;",
          "uniform float uFreq;",
          "uniform vec4 RING;",
          "attribute float aBase;",
          "attribute float aBand;",
          "attribute float aPhase;",
          "attribute float aSize;",
          "varying float vBand;",
          "varying float vPhase;",
          "varying float vSize;",
          "void main(){",
          "  float speed = 0.10;",
          "  float base = aBase + uTime * speed;",
          "  base = mod(base, 1.15);",
          "  float x = base * 2.0 - 1.0;",
          "  float wave = sin(x * uFreq * 3.0 + uTime * 1.5) * 0.55",
          "             + sin(x * uFreq * 5.6 + uTime * 0.9 + 1.3) * 0.3",
          "             + sin(x * uFreq * 2.1 - uTime * 1.2 + 0.4) * 0.4;",
          "  float env = 0.8 + 0.6 * sin(x * 1.4 + uTime * 0.4);",
          "  float centerY = 0.35 + wave * uAmp * env * 0.15;",
          "  float bandW = 0.05 + 0.04 * sin(x * 3.0 + uTime * 0.6);",
          "  float bandY = centerY + aBand * bandW;",
          "  float py = bandY;",
          "  float px = x;",
          "  float rx = RING.x;",
          "  float ry = RING.y;",
          "  float dx = px - rx;",
          "  float dy = py - ry;",
          "  float dist = length(vec2(dx, dy));",
          "  float nearR = smoothstep(RING.r * 1.7, RING.r * 0.5, dist);",
          "  float ang = atan(dy, dx) + 0.12 + uTime * 0.6 * (1.0 - nearR * 0.5);",
          "  float ringR = clamp(dist, RING.r * 0.3, RING.r * 0.78);",
          "  px = mix(px, rx + cos(ang) * ringR, nearR);",
          "  py = mix(py, ry + sin(ang) * ringR, nearR);",
          "  float mx = uMouse.x * 1.5;",
          "  float my = uMouse.y * 0.9;",
          "  float md = length(vec2(px - mx, py - my));",
          "  float push = uMouseActive * exp(-md * 2.2) * 0.22;",
          "  px += (px - mx) * push;",
          "  py += (py - my) * push;",
          "  float outX = px;",
          "  float outY = py;",
          "  gl_Position = vec4(outX, outY, 0.0, 1.0);",
          "  float ps = aSize * (1.2 + 0.6 * sin(uTime * 1.5 + aPhase * 3.0));",
          "  gl_PointSize = ps * 4.5;",
          "  vBand = aBand;",
          "  vPhase = aPhase;",
          "  vSize = aSize;",
          "}"
        ].join("\n");

        var fragmentShader = [
          "uniform float uTime;",
          "varying float vBand;",
          "varying float vPhase;",
          "varying float vSize;",
          "void main(){",
          "  vec2 uv = gl_PointCoord - 0.5;",
          "  float d = length(uv);",
          "  float glow = smoothstep(0.5, 0.0, d);",
          "  // 微软蓝渐变（带心深蓝→边缘淡蓝），浅底用较饱和蓝保证对比",
          "  float k = clamp(0.5 - vBand * 0.5, 0.0, 1.0);",
          "  vec3 deep = vec3(0.12, 0.31, 0.56);",    // #1F4F8F
          "  vec3 azure = vec3(0.0, 0.47, 0.83);",     // #0078D4
          "  vec3 cyan = vec3(0.43, 0.71, 0.94);",     // #6FB5EF
          "  vec3 col;",
          "  if (k < 0.5) { col = mix(deep, azure, k * 2.0); }",
          "  else { col = mix(azure, cyan, (k - 0.5) * 2.0); }",
          "  float tw = 0.7 + 0.3 * sin(uTime * 1.8 + vPhase * 4.0);",
          "  float alpha = glow * tw * (0.8 + 0.2 * vSize);",
          "  gl_FragColor = vec4(col, alpha);",
          "}"
        ].join("\n");

        var material = new THREE.ShaderMaterial({
          vertexShader: vertexShader,
          fragmentShader: fragmentShader,
          transparent: true,
          depthWrite: false,
          blending: THREE.NormalBlending,   // 浅底用普通混合（不用发光加性）
          uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uMouseActive: { value: 0 },
            uAspect: { value: 1 },
            uAmp: { value: 0.9 },
            uFreq: { value: 0.85 },
            RING: { value: new THREE.Vector4(RING.x, RING.y, RING.r, 0) }
          }
        });

        window.__paused = false;
        window.__togglePause = function () { window.__paused = !window.__paused; };

        var points = new THREE.Points(posGeo, material);
        scene.add(points);

        window.addEventListener("mousemove", function (e) {
          mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          mouse.y = ((e.clientY / window.innerHeight) * 2 - 1) * -1;
          mouse.active = Math.min(1, mouse.active + 0.06);
        });
        window.addEventListener("mouseleave", function () { mouse.active = 0; });

        var last = performance.now();
        function loop(now) {
          requestAnimationFrame(loop);
          if (window.__paused) { last = now; return; }
          var dt = (now - last) / 1000; last = now;
          t += dt;
          material.uniforms.uTime.value = t;
          material.uniforms.uMouse.value.set(mouse.x, mouse.y);
          material.uniforms.uMouseActive.value = mouse.active;
          material.uniforms.uAspect.value = window.innerWidth / window.innerHeight;
          renderer.render(scene, camera);
        }
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
