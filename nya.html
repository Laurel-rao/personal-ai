<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>番号下载 · 创作工作台</title>
  <link rel="stylesheet" href="/ui-framework.css" />
  <link rel="stylesheet" href="/admin.css" />
  <link rel="stylesheet" href="/workspace-pages.css" />
  <style>
    body { background: var(--page-bg, #f5f7f9); color: var(--page-text, #243242); }
    .nya-wrap { max-width: 1120px; margin: 0 auto; padding: 8px 4px 60px; }
    .nya-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
    .nya-eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--page-muted, #7b8795); }
    .nya-title { margin: 4px 0 6px; font-size: 26px; color: var(--page-text, #243242); }
    .nya-sub { margin: 0; color: var(--page-muted, #7b8795); font-size: 13px; }
    .nya-form { display: flex; gap: 10px; flex: 1 1 420px; }
    .nya-form input { flex: 1; min-width: 0; background: var(--page-surface, #fff); border: 1px solid var(--page-line, #e3e9ee); color: var(--page-text, #243242); border-radius: 10px; padding: 12px 14px; font-size: 15px; outline: none; }
    .nya-form input:focus { border-color: var(--page-primary, #087f65); box-shadow: 0 0 0 3px rgba(8,127,101,.12); }
    .nya-form button { border: 0; border-radius: 10px; padding: 12px 22px; font-weight: 600; cursor: pointer; background: var(--page-primary, #087f65); color: #fff; }
    .nya-form button:hover { background: #0a9578; }
    .nya-form button:disabled { opacity: .55; cursor: wait; }
    .nya-status { min-height: 20px; margin: 6px 0 14px; font-size: 13px; color: var(--page-muted, #7b8795); }
    .nya-status.error { color: var(--page-danger, #c34f55); }
    .nya-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; font-size: 12.5px; }
    .nya-toolbar label { color: var(--page-muted, #7b8795); }
    .nya-toolbar select { background: var(--page-surface, #fff); color: var(--page-text, #243242); border: 1px solid var(--page-line, #e3e9ee); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; }
    .nya-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .nya-chips button { border: 1px solid var(--page-line, #e3e9ee); background: var(--page-surface, #fff); color: var(--page-muted, #7b8795); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
    .nya-chips button.active { border-color: var(--page-primary, #087f65); color: var(--page-primary, #087f65); background: var(--page-primary-soft, #edf7f2); }
    .nya-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 16px; }
    .nya-card { display: flex; flex-direction: column; gap: 9px; padding: 10px; border-radius: 12px; background: var(--page-surface, #fff); border: 1px solid var(--page-line, #e3e9ee); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
    .nya-card:hover { border-color: rgba(8,127,101,.35); transform: translateY(-2px); box-shadow: 0 10px 28px rgba(36,50,66,.1); }
    .nya-cover { width: 100%; aspect-ratio: 3 / 2; border-radius: 8px; overflow: hidden; background: #0f1218; position: relative; display: block; }
    .nya-cover img { width: 100%; height: 100%; object-fit: contain; display: block; background: #0f1218; cursor: zoom-in; }
    .nya-cover .nya-noimg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 11px; color: rgba(255,255,255,.55); text-align: center; padding: 8px; }
    .nya-cover.empty img { display: none; }
    .nya-cover.empty .nya-noimg { display: flex; }
    .nya-name { font-size: 13px; line-height: 1.4; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; color: var(--page-text, #243242); }
    .nya-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
    .nya-badges span { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: #f1f4f7; color: #5d6b7a; }
    .nya-badges .sub { background: var(--page-primary-soft, #edf7f2); color: var(--page-primary, #087f65); }
    .nya-badges .unc { background: #fdeeee; color: #c34f55; }
    .nya-badges .kind { background: #eef2fb; color: #4a67b3; }
    .nya-meta { display: flex; gap: 8px 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--page-muted, #7b8795); }
    .nya-meta .seed { color: #0f9d58; }
    .nya-meta .leech { color: #d0555b; }
    .nya-meta .src { color: #4a67b3; }
    .nya-meta .rel { color: #b86e00; }
    .nya-meta .actor { color: var(--page-primary, #087f65); }
    .nya-actions { display: flex; gap: 6px; margin-top: 2px; }
    .nya-actions button { flex: 1; border: 1px solid var(--page-line, #e3e9ee); background: var(--page-surface, #fff); color: var(--page-text, #243242); border-radius: 8px; padding: 7px 6px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .nya-actions button.primary { background: var(--page-primary, #087f65); border: 0; color: #fff; font-weight: 600; }
    .nya-actions button:disabled { opacity: .5; cursor: wait; }
    .nya-empty { grid-column: 1 / -1; padding: 40px 0; text-align: center; color: var(--page-muted, #7b8795); font-size: 14px; }
    .nya-hint { margin-top: 22px; font-size: 12px; color: var(--page-muted, #7b8795); line-height: 1.7; }
    .nya-hint code { background: #eef2f5; padding: 1px 6px; border-radius: 5px; }
    .nya-context-menu { position: fixed; z-index: 2147483100; min-width: 136px; padding: 4px; border: 1px solid var(--page-line, #e3e9ee); border-radius: 8px; background: var(--page-surface, #fff); box-shadow: 0 14px 40px rgba(23,32,43,.25); }
    .nya-context-menu[hidden] { display: none !important; }
    .nya-context-menu button { display: block; width: 100%; border: 0; border-radius: 5px; background: none; color: var(--page-text, #243242); text-align: left; padding: 7px 9px; font-size: 12px; cursor: pointer; }
    .nya-context-menu button:hover { background: var(--page-primary-soft, #edf7f2); color: var(--page-primary, #087f65); }
    .nya-context-menu button[hidden] { display: none; }
    .nya-lightbox { position: fixed; inset: 0; z-index: 2147483000; display: flex; align-items: center; justify-content: center; background: rgba(23,32,43,.55); backdrop-filter: blur(3px); }
    .nya-lightbox[hidden] { display: none; }
    .nya-lb-loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 10px; color: #eef2f7; font-size: 13px; background: rgba(15,20,28,.72); padding: 10px 16px; border-radius: 999px; border: 0; box-shadow: 0 6px 20px rgba(0,0,0,.35); z-index: 2; }
    .nya-lb-loading[hidden] { display: none; }
    .nya-lb-spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.25); border-top-color: #8fd0ff; border-radius: 50%; animation: nyaLbSpin .8s linear infinite; }
    @keyframes nyaLbSpin { to { transform: rotate(360deg); } }
    .nya-lb-img { transition: opacity .15s ease; max-width: min(92vw, 1400px); max-height: 82vh; object-fit: contain; border-radius: 8px; box-shadow: 0 20px 60px rgba(23,32,43,.35); background: #0f1218; }
    .nya-lb-close, .nya-lb-prev, .nya-lb-next { position: absolute; z-index: 3; border: 0; background: rgba(255,255,255,.85); color: #243242; cursor: pointer; border-radius: 50%; width: 46px; height: 46px; font-size: 24px; line-height: 1; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(23,32,43,.25); }
    .nya-lb-close { top: 18px; right: 18px; }
    .nya-lb-prev { left: 18px; top: 50%; transform: translateY(-50%); }
    .nya-lb-next { right: 18px; top: 50%; transform: translateY(-50%); }
    .nya-lb-close:hover, .nya-lb-prev:hover, .nya-lb-next:hover { background: #fff; }
    .nya-lb-bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: linear-gradient(transparent, rgba(23,32,43,.75)); color: #eef2f7; font-size: 13px; }
    .nya-lb-bar .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nya-lb-bar .counter { color: #b9c3cf; }
    .nya-lb-bar a { color: #8fd0ff; text-decoration: none; border: 1px solid rgba(143,208,255,.5); padding: 6px 12px; border-radius: 8px; }
    .nya-lb-bar a:hover { background: rgba(143,208,255,.15); }
</style>
</head>
<body data-page="nya">
  <div class="nya-wrap">
    <header class="nya-head">
      <div>
        <div class="nya-eyebrow">NYAA SEARCH · THUNDER</div>
        <h1 class="nya-title">番号下载</h1>
        <p class="nya-sub">输入番号搜索资源，选一个结果一键送入迅雷下载。</p>
      </div>
    </header>

    <form class="nya-form" id="nyaForm" autocomplete="off">
      <input id="nyaQuery" name="q" placeholder="输入番号，如 HMN-914 / SSIS-1017" aria-label="搜索番号" required />
      <button id="nyaSearch" type="submit">搜索</button>
    </form>
    <div class="nya-status" id="nyaStatus" role="status"></div>
    <div class="nya-toolbar" id="nyaToolbar" hidden>
      <label for="nyaSort">排序</label>
      <select id="nyaSort">
        <option value="default">默认（来源顺序）</option>
        <option value="seed">做种多优先</option>
        <option value="date">最新上传优先</option>
        <option value="size">体积大优先</option>
      </select>
      <div class="nya-chips" id="nyaFilters">
        <button type="button" data-filter="all" class="active">全部</button>
        <button type="button" data-filter="sub">中文字幕</button>
        <button type="button" data-filter="unc">无码</button>
        <button type="button" data-filter="multi">多人</button>
        <button type="button" data-filter="collection">合集</button>
      </div>
    </div>

    <div class="nya-grid" id="nyaList">
      <div class="nya-empty">还没有结果，先输入番号搜索。</div>
    </div>

    <p class="nya-hint">
      结果来自 sukebei（BT 站，带做种数）+ btdig（DHT 索引，磁力直送），均经本机代理 <code id="proxyHint">127.0.0.1:7897</code> 访问。<br />
      下载会把种子保存到 <code>~/Movies/Videos/&lt;番号&gt;/</code> 并自动调用迅雷；迅雷里确认后开始下载。
    </p>
  </div>

  <div class="nya-context-menu" id="nyaContextMenu" hidden role="menu">
    <button type="button" data-action="preview">查看大图</button>
    <button type="button" data-action="thunder">送迅雷</button>
    <button type="button" data-action="magnet">复制磁力</button>
    <button type="button" data-action="code">复制番号</button>
    <button type="button" data-action="cover">下载封面</button>
  </div>

  <div class="nya-lightbox" id="nyaLightbox" hidden role="dialog" aria-modal="true" aria-label="封面预览">
    <button class="nya-lb-close" id="nyaLbClose" type="button" aria-label="关闭">×</button>
    <button class="nya-lb-prev" id="nyaLbPrev" type="button" aria-label="上一张">‹</button>
    <img class="nya-lb-img" id="nyaLbImg" alt="" />
    <div class="nya-lb-loading" id="nyaLbLoading" hidden><span class="nya-lb-spinner"></span><span id="nyaLbLoadingText">加载中…</span></div>
    <button class="nya-lb-next" id="nyaLbNext" type="button" aria-label="下一张">›</button>
    <div class="nya-lb-bar">
      <span class="title" id="nyaLbTitle"></span>
      <span class="counter" id="nyaLbCounter"></span>
      <a id="nyaLbDownload" download>下载原图</a>
    </div>
  </div>
  <script src="/ui-framework.js"></script>
  <script>
    (function () {
      const form = document.getElementById('nyaForm');
      const input = document.getElementById('nyaQuery');
      const searchBtn = document.getElementById('nyaSearch');
      const list = document.getElementById('nyaList');
      const status = document.getElementById('nyaStatus');
      const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const extractCode = (title) => {
        const match = String(title || '').match(/(FC2[-_ ]?PPV[-_ ]?\d+|(?:FC2PPV?)[-_ ]?\d+|\d{3}GANA[-_ ]?\d+|[A-Za-z]{2,6}[-_ ]?\d{2,5}(?:[-_ ]?[A-Z](?![A-Za-z]))?)/i);
        return match ? match[1].replace(/[_ ]/g, '-').toUpperCase() : '';
      };

      function setStatus(text, isError) {
        status.textContent = text || '';
        status.classList.toggle('error', !!isError);
      }

      const toolbar = document.getElementById('nyaToolbar');
      const sortSelect = document.getElementById('nyaSort');
      const filterWrap = document.getElementById('nyaFilters');
      let currentResults = [];
      let currentSorted = [];
      let activeFilter = 'all';
      let activeSort = 'default';

      const FILTERS = {
        all: () => true,
        sub: (item) => !!item.subtitle,
        unc: (item) => !!item.uncensored,
        multi: (item) => item.type === '多人',
        collection: (item) => item.type === '合集',
      };

      const parseSize = (text) => {
        const match = String(text || '').match(/([\d.]+)\s*(TB|GB|GiB|MB|MiB|KiB|KB)/i);
        if (!match) return 0;
        const unit = match[2].toUpperCase();
        const mult = unit.startsWith('T') ? 1e12 : unit.startsWith('G') ? 1e9 : unit.startsWith('M') ? 1e6 : 1e3;
        return parseFloat(match[1]) * mult;
      };

      const coverPreview = (code) => `/api/nya/cover?code=${encodeURIComponent(code)}&size=medium&v=2`;
      const coverFull = (code) => `/api/nya/cover?code=${encodeURIComponent(code)}&size=full&v=2`;

      function render(results) {
        currentResults = results || [];
        toolbar.hidden = currentResults.length === 0;
        renderList();
      }

      function renderList() {
        const filtered = currentResults.filter(FILTERS[activeFilter] || FILTERS.all);
        const sorted = filtered.slice();
        if (activeSort === 'seed') sorted.sort((a, b) => (b.seeders || 0) - (a.seeders || 0));
        else if (activeSort === 'date') sorted.sort((a, b) => String(b.uploaded_at || '').localeCompare(String(a.uploaded_at || '')));
        else if (activeSort === 'size') sorted.sort((a, b) => parseSize(b.size) - parseSize(a.size));

        if (!sorted.length) {
          list.innerHTML = '<div class="nya-empty">当前筛选下没有资源。</div>';
          return;
        }

        list.innerHTML = sorted.map((item, index) => {
          const code = extractCode(item.title);
          const badges = [];
          if (item.type) badges.push(`<span class="kind">${esc(item.type)}</span>`);
          if (item.quality) badges.push(`<span>${esc(item.quality)}</span>`);
          if (item.subtitle) badges.push('<span class="sub">中文字幕</span>');
          if (item.uncensored) badges.push('<span class="unc">无码</span>');
          if (item.duration) badges.push(`<span>${esc(item.duration)}</span>`);
          const date = item.uploaded_at ? esc(item.uploaded_at.slice(0, 10)) : '';
          return `
          <article class="nya-card" data-index="${index}">
            <div class="nya-cover${code ? '' : ' empty'}">
              ${code ? `<img src="${coverPreview(code)}" alt="" loading="lazy" onerror="this.parentNode.classList.add('empty')">` : ''}
              <span class="nya-noimg">无封面</span>
            </div>
            <div class="nya-name" title="${esc(item.title || item.view_id)}">${esc(item.title || item.view_id)}</div>
            <div class="nya-badges">${badges.join('')}</div>
            <div class="nya-meta">
              <span>${code ? esc(code) + ' · ' : ''}${esc(item.size || '未知大小')}</span>
              ${item.source === 'btdig'
                ? '<span class="src">btdig · DHT</span>'
                : `<span class="seed">做种 ${item.seeders}</span><span class="leech">下载 ${item.downloads || item.leechers}</span>`}
              ${date ? `<span>上传 ${date}</span>` : ''}
              ${code ? `<span class="rel" data-code="${esc(code)}">发售 …</span>` : ''}
              ${code ? `<span class="actor" data-code="${esc(code)}"></span>` : ''}
            </div>
            <div class="nya-actions">
              <button type="button" class="primary" data-index="${index}">送迅雷</button>
              <button type="button" data-copy="${index}">磁力</button>
            </div>
          </article>`;
        }).join('');

        list.querySelectorAll('button[data-index]').forEach((btn) => {
          btn.addEventListener('click', () => download(sorted[Number(btn.dataset.index)], btn));
        });
        loadReleaseDates();

        currentSorted = sorted;
        lightboxItems = sorted
          .map((item) => {
            const code = extractCode(item.title);
            return code ? { src: coverPreview(code), full: coverFull(code), title: item.title || code, code } : null;
          })
          .filter(Boolean);
        list.querySelectorAll('.nya-cover img').forEach((img) => {
          const idx = lightboxItems.findIndex((entry) => entry.src === img.getAttribute('src'));
          img.addEventListener('click', () => openLightbox(idx >= 0 ? idx : 0));
        });
        list.querySelectorAll('.nya-cover').forEach((cover) => {
          cover.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            const card = cover.closest('.nya-card');
            const index = Number(card?.dataset.index);
            const item = currentSorted[index];
            if (!item) return;
            showContextMenu(event, item, index, extractCode(item.title));
          });
        });

        list.querySelectorAll('button[data-copy]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const item = sorted[Number(btn.dataset.copy)];
            if (!item.magnet) { setStatus('该种子没有磁力链接', true); return; }
            try {
              await navigator.clipboard.writeText(item.magnet);
              setStatus('磁力已复制');
            } catch (error) {
              setStatus('复制失败，请手动选择', true);
            }
          });
        });
      }

      async function loadReleaseDates() {
        const nodes = Array.from(list.querySelectorAll('span.rel[data-code]'));
        if (!nodes.length) return;
        const codes = [...new Set(nodes.map((node) => node.dataset.code))];
        const map = new Map();
        // 一次批量请求（后端并发查询），取代逐卡请求
        try {
          const response = await fetch(`/api/nya/releases?codes=${encodeURIComponent(codes.join(','))}`);
          const data = await response.json();
          if (data.success) {
            Object.entries(data.items || {}).forEach(([code, info]) => map.set(code.toUpperCase(), info));
          }
        } catch (error) { /* 保持占位 */ }
        nodes.forEach((node) => {
          const info = map.get(node.dataset.code.toUpperCase());
          if (!info) { node.textContent = '发售 —'; return; }
          node.textContent = info.date ? `发售 ${info.date}` : '发售 —';
          const detail = [info.studio, (info.genres || []).join(' / '), info.runtime, info.actress].filter(Boolean).join(' · ');
          node.title = detail || '该番号未收录发售信息';
          const actorNode = node.parentElement?.querySelector('span.actor');
          if (actorNode) actorNode.textContent = info.actress || '';
        });
      }

      sortSelect?.addEventListener('change', () => {
        activeSort = sortSelect.value;
        renderList();
      });
      filterWrap?.addEventListener('click', (event) => {
        const btn = event.target.closest('button[data-filter]');
        if (!btn) return;
        activeFilter = btn.dataset.filter;
        filterWrap.querySelectorAll('button').forEach((item) => item.classList.toggle('active', item === btn));
        renderList();
      });

      function mergeResults(base, extra) {
        const seen = new Set(base.map((item) => item.magnet || item.view_id));
        const merged = base.slice();
        extra.forEach((item) => {
          const key = item.magnet || item.view_id;
          if (!seen.has(key)) { seen.add(key); merged.push(item); }
        });
        return merged;
      }

      async function search(query) {
        setStatus('搜索中（sukebei）…');
        const first = await fetch(`/api/nya/search?q=${encodeURIComponent(query)}&source=sukebei`);
        const base = await first.json();
        if (!first.ok || !base.success) throw new Error(base.error || '搜索失败');
        render(base.results || []);
        setStatus(`找到 ${base.count} 条（sukebei），正在补充 DHT 源…`);
        try {
          const second = await fetch(`/api/nya/search?q=${encodeURIComponent(query)}&source=btdig`);
          const extra = await second.json();
          if (extra.success && (extra.results || []).length) {
            const merged = mergeResults(base.results || [], extra.results || []);
            render(merged);
            setStatus(`找到 ${merged.length} 条（sukebei ${base.count} · DHT ${extra.results.length}）`);
          } else {
            setStatus(`找到 ${base.count} 条（sukebei · DHT 源暂不可用）`);
          }
        } catch (error) {
          setStatus(`找到 ${base.count} 条（sukebei · DHT 源暂不可用）`);
        }
      }

      async function download(item, btn) {
        const code = extractCode(item.title) || item.view_id;
        btn.disabled = true;
        const original = btn.textContent;
        btn.textContent = '发送中…';
        try {
          const response = await fetch('/api/nya/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(item.view_id ? { view_id: item.view_id, code, magnet: item.magnet } : { magnet: item.magnet, code }),
          });
          const data = await response.json();
          if (!response.ok || !data.success) throw new Error(data.error || '发送失败');
          setStatus(`已送入迅雷：${data.torrent || '磁力任务'}`);
          btn.textContent = '已发送';
        } catch (error) {
          setStatus(error.message, true);
          btn.textContent = original;
        } finally {
          setTimeout(() => { btn.disabled = false; if (btn.textContent === '已发送') btn.textContent = original; }, 4000);
        }
      }

      // ---------------- 灯箱 ----------------
      let lbToken = 0;
      let lightboxItems = [];
      let lightboxIndex = 0;
      const lightbox = document.getElementById('nyaLightbox');
      if (lightbox && lightbox.parentElement !== document.body) document.body.appendChild(lightbox);
      const lbImg = document.getElementById('nyaLbImg');
      const lbTitle = document.getElementById('nyaLbTitle');
      const lbCounter = document.getElementById('nyaLbCounter');
      const lbDownload = document.getElementById('nyaLbDownload');
      const lbLoading = document.getElementById('nyaLbLoading');
      const lbLoadingText = document.getElementById('nyaLbLoadingText');
      const lbPrev = document.getElementById('nyaLbPrev');
      const lbNext = document.getElementById('nyaLbNext');

      function showLightboxItem() {
        if (!lightboxItems.length) return;
        const item = lightboxItems[lightboxIndex];
        const previewSrc = item.src;
        const fullSrc = item.full || previewSrc;
        let upgraded = false;
        const token = ++lbToken;
        // The card already loaded previewSrc, so the lightbox opens instantly.
        lbLoading.hidden = true;
        lbImg.style.opacity = '1';
        lbImg.onload = () => {
          if (token !== lbToken) return;
          lbImg.style.opacity = '1';
          lbLoading.hidden = true;
          if (fullSrc !== previewSrc && !upgraded) {
            upgraded = true;
            const fullImage = new Image();
            fullImage.onload = () => { if (token === lbToken) lbImg.src = fullSrc; };
            fullImage.src = fullSrc;
          }
        };
        lbImg.onerror = () => {
          if (token !== lbToken) return;
          lbLoading.hidden = false;
          lbLoadingText.textContent = '加载失败，点击图片重试';
        };
        lbImg.onclick = (event) => {
          event.stopPropagation();
          lbImg.src = `${fullSrc}${fullSrc.includes('?') ? '&' : '?'}_=${Date.now()}`;
        };
        lbImg.src = previewSrc;
        lbImg.alt = item.title;
        lbTitle.textContent = item.title;
        lbCounter.textContent = `${lightboxIndex + 1} / ${lightboxItems.length}`;
        lbDownload.href = fullSrc;
        lbDownload.download = `${item.code || 'cover'}.jpg`;
        lbDownload.textContent = '下载原图';
        const single = lightboxItems.length <= 1;
        lbPrev.style.display = single ? 'none' : '';
        lbNext.style.display = single ? 'none' : '';
        [1, -1].forEach((delta) => {
          const neighbor = lightboxItems[(lightboxIndex + delta + lightboxItems.length) % lightboxItems.length];
          if (neighbor && neighbor.full && neighbor.full !== fullSrc) { const pre = new Image(); pre.src = neighbor.full; }
        });
      }

      const contextMenu = document.getElementById('nyaContextMenu');
      let contextItem = null;
      let contextIndex = -1;
      let contextCode = '';

      function hideContextMenu() {
        contextMenu.hidden = true;
        contextItem = null;
        contextIndex = -1;
        contextCode = '';
      }

      function showContextMenu(event, item, index, code) {
        contextItem = item;
        contextIndex = index;
        contextCode = code || '';
        contextMenu.querySelector('[data-action="preview"]').hidden = !contextCode;
        contextMenu.querySelector('[data-action="code"]').hidden = !contextCode;
        contextMenu.querySelector('[data-action="cover"]').hidden = !contextCode;
        contextMenu.hidden = false;
        const width = contextMenu.offsetWidth || 140;
        const height = contextMenu.offsetHeight || 140;
        contextMenu.style.left = `${Math.max(8, Math.min(event.clientX, window.innerWidth - width - 8))}px`;
        contextMenu.style.top = `${Math.max(8, Math.min(event.clientY, window.innerHeight - height - 8))}px`;
      }

      contextMenu.addEventListener('click', async (event) => {
        const button = event.target.closest('[data-action]');
        if (!button || !contextItem) return;
        const item = contextItem;
        const code = contextCode;
        const index = contextIndex;
        const action = button.dataset.action;
        hideContextMenu();
        if (action === 'preview') {
          const lightboxIndex = lightboxItems.findIndex((entry) => entry.code === code);
          if (lightboxIndex >= 0) openLightbox(lightboxIndex);
          return;
        }
        if (action === 'thunder') {
          const trigger = document.querySelector(`.nya-card[data-index="${index}"] .nya-actions button.primary`);
          if (trigger) download(item, trigger);
          return;
        }
        if (action === 'magnet') {
          if (!item.magnet) { setStatus('该种子没有磁力链接', true); return; }
          try { await navigator.clipboard.writeText(item.magnet); setStatus('磁力已复制'); }
          catch (error) { setStatus('复制失败，请手动选择', true); }
          return;
        }
        if (action === 'code') {
          try { await navigator.clipboard.writeText(code); setStatus('番号已复制'); }
          catch (error) { setStatus('复制失败，请手动选择', true); }
          return;
        }
        if (action === 'cover') {
          const link = document.createElement('a');
          link.href = coverFull(code);
          link.download = `${code}.jpg`;
          link.click();
        }
      });
      document.addEventListener('click', hideContextMenu);
      document.addEventListener('scroll', hideContextMenu, true);
      window.addEventListener('resize', hideContextMenu);
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape') hideContextMenu(); });

      function openLightbox(index) {
        if (!lightboxItems.length) return;
        lightboxIndex = Math.max(0, Math.min(index, lightboxItems.length - 1));
        lightbox.hidden = false;
        document.body.style.overflow = 'hidden';
        showLightboxItem();
      }

      function closeLightbox() {
        lightbox.hidden = true;
        document.body.style.overflow = '';
      }

      function stepLightbox(delta) {
        if (!lightboxItems.length) return;
        lightboxIndex = (lightboxIndex + delta + lightboxItems.length) % lightboxItems.length;
        showLightboxItem();
      }

      document.getElementById('nyaLbClose').addEventListener('click', closeLightbox);
      document.getElementById('nyaLbPrev').addEventListener('click', () => stepLightbox(-1));
      document.getElementById('nyaLbNext').addEventListener('click', () => stepLightbox(1));
      lightbox.addEventListener('click', (event) => { if (event.target === lightbox) closeLightbox(); });
      document.addEventListener('keydown', (event) => {
        if (lightbox.hidden) return;
        if (event.key === 'Escape') closeLightbox();
        else if (event.key === 'ArrowLeft') stepLightbox(-1);
        else if (event.key === 'ArrowRight') stepLightbox(1);
      });

      async function runSearch(query) {
        searchBtn.disabled = true;
        try {
          await search(query);
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          searchBtn.disabled = false;
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const query = input.value.trim();
        if (!query) return;
        await runSearch(query);
      });

      // 支持 /nya?q=CODE 直达搜索（选手作品列表点番号跳转）
      const initialQuery = new URLSearchParams(location.search).get('q');
      if (initialQuery) {
        input.value = initialQuery;
        runSearch(initialQuery.trim());
      }
    })();
  </script>
</body>
</html>
