<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Photo Lab · ComfyUI 生成工作台</title>
  <base href="/photo/">
  <link rel="stylesheet" href="static/app.css">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../ui-framework.css">
  <link rel="stylesheet" href="static/embed.css">
</head>
<body data-page="image"{% if embedded %} class="embedded"{% endif %}>
  <div class="app-shell">
    <header class="page-heading" data-page-heading><div class="page-heading-actions"><span class="page-service"><span id="healthDot" class="health-dot"></span><span id="healthText">正在连接生成引擎</span></span><button class="icon-button" id="refreshBtn" type="button" aria-label="刷新图片任务" title="刷新数据"><i class="fa fa-rotate-right" aria-hidden="true"></i></button></div></header>
    <main class="workspace">
      <section class="composer panel">
        <div class="eyebrow">CREATE / 01</div>
        <h2>生成参数</h2><p class="panel-description">描述画面，选择尺寸，添加到生成队列。</p>
        <form id="generateForm">
          <div id="singlePromptField">
            <label for="prompt">正向提示词 <span>必填</span></label>
            <textarea id="prompt" rows="3" placeholder="描述主体、场景、光线和镜头语言…" required>一个身穿白色夏日连衣裙的女孩站在海边，金色夕阳，电影感摄影</textarea>
          </div>
          <div id="batchPromptField" hidden>
            <label for="batchPrompts">批量提示词 <span>一行一条</span></label>
            <textarea id="batchPrompts" rows="5" placeholder="一行一条提示词&#10;海边夕阳下的电影感人像&#10;窗边自然光的半身写真"></textarea>
            <div id="batchPromptCount" class="batch-count">0 条待生成</div>
          </div>
          <div class="size-presets" aria-label="尺寸比例预设">
            <button type="button" class="size-preset" data-width="1024" data-height="1024">方图 1:1</button>
            <button type="button" class="size-preset" data-width="768" data-height="1024">人像 3:4</button>
            <button type="button" class="size-preset" data-width="768" data-height="1152">海报 2:3</button>
            <button type="button" class="size-preset" data-width="1280" data-height="720">横版 16:9</button>
            <button type="button" class="size-preset" data-width="720" data-height="1280">手机 9:16</button>
          </div>
          <details id="generationOptions" class="generation-options">
            <summary>更多设置 <span class="options-expand">展开</span><span class="options-collapse">收起</span></summary>
            <div class="generate-mode" role="tablist" aria-label="生成方式">
              <button type="button" class="mode-tab active" data-mode="single">单张</button>
              <button type="button" class="mode-tab" data-mode="batch">批量</button>
            </div>
            <label for="negativePrompt">负向提示词</label>
            <input id="negativePrompt" value="blurry ugly bad, low quality">
            <div class="field-row dimensions-row">
              <div><label for="width">宽度 <span>PX</span></label><input id="width" type="number" min="64" max="2048" step="8" value="1024"></div>
              <div><label for="height">高度 <span>PX</span></label><input id="height" type="number" min="64" max="2048" step="8" value="1024"></div>
              <div><label for="batchSize">每条生成 <span>张</span></label><input id="batchSize" type="number" min="1" max="8" step="1" value="2"></div>
            </div>
            <div class="field-row">
              <div><label for="seed">种子</label><input id="seed" type="number" placeholder="随机"></div>
            </div>
          </details>
          <button id="submitButton" class="primary-button" type="submit"><span>加入生成队列</span><b>↗</b></button>
          <div id="formMessage" class="form-message"></div>
        </form>
      </section>
      <section class="queue-column">
        <div class="section-heading"><div><div class="eyebrow">QUEUE / 02</div><h2>任务进度</h2></div><div class="queue-heading-actions"><span id="queueCount" class="counter" aria-live="polite">生成队列 0</span><button id="clearQueue" class="text-button" type="button">清空队列</button></div></div>
        <div id="activeTasks" class="task-list empty-state"><div class="empty-icon">◌</div><strong>还没有进行中的任务</strong><span>提交一条提示词，进度会显示在这里</span></div>
        <div class="section-heading history-heading"><div><div class="eyebrow">ARCHIVE / 03</div><h2>历史生成</h2></div><div class="history-actions"><button id="toggleHistory" class="text-button" type="button" aria-expanded="false" aria-controls="historyContent">展示</button></div></div>
        <div id="historyContent" hidden>
          <div id="history" class="history-list"></div>
          <div id="historyPager" class="history-pager" hidden>
            <button type="button" class="pager-button" data-history-page="previous" title="上一页">←</button>
            <span id="historyPageInfo"></span>
            <button type="button" class="pager-button" data-history-page="next" title="下一页">→</button>
          </div>
          <div class="history-maintenance">
            <button id="clearHistory" class="text-button history-danger-button" type="button" hidden>清理记录</button>
            <span id="historyClearMessage" role="status">清理会影响历史、图库和标注展示，请谨慎操作。</span>
          </div>
        </div>
      </section>
    </main>
  </div>
  <dialog id="clearHistoryDialog" class="history-clear-dialog" aria-labelledby="clearHistoryTitle" aria-describedby="clearHistoryDescription">
    <h2 id="clearHistoryTitle">确认清理全部历史记录？</h2>
    <p id="clearHistoryDescription">这会移除当前账号有权管理的全部已完成、失败和取消的任务记录，不仅是当前页。相关图片将不再显示在历史、图库和标注页中；原图文件保留，但页面无法一键恢复。进行中的任务不受影响。</p>
    <p id="clearHistoryError" class="history-clear-error" role="alert"></p>
    <div class="history-clear-dialog-actions">
      <button id="cancelClearHistory" class="text-button" type="button" autofocus>取消，保留记录</button>
      <button id="confirmClearHistory" class="text-button history-danger-button" type="button">确认清理全部记录</button>
    </div>
  </dialog>
  <script src="static/app.js"></script><script src="../ui-framework.js"></script>
</body>
</html>
