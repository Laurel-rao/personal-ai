<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图片库 · Photo Lab</title>
  <base href="{{ request.script_root or '' }}/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/app.css">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../ui-framework.css">
  <link rel="stylesheet" href="static/library.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="library-body">
  <header class="topbar library-topbar">
    <a class="brand brand-link" href="./"><span class="brand-mark">P</span><span>PHOTO LAB</span><small>IMAGE LIBRARY</small></a>
    <nav class="library-menu" aria-label="工作区导航">
      <a class="menu-link" href="../" target="_top">视频生成</a>
      <a class="menu-link" href="../image" target="_top">图片生成</a>
      <a class="menu-link" href="../chat" target="_top">文本对话</a>
      <a class="menu-link" href="rewrite">记忆仿写</a>
      <a class="menu-link" href="review">图片标注</a>
      <a class="menu-link active" href="library">图片库</a>
    </nav>
  </header>
  <main class="library-page">
    <div class="library-heading">
      <div><div class="eyebrow">LIBRARY / 05</div><h1>图片库</h1><p>按类别、标注、时间和提示词检索全部生成图片。</p></div>
      <div class="library-total" id="libraryTotal">加载中</div>
    </div>
    <section class="library-filters" aria-label="图片筛选">
      <label class="library-search">提示词搜索<input id="librarySearch" type="search" placeholder="输入提示词关键词"></label>
      <div class="library-filter-row">
        <fieldset class="library-category"><legend>类别</legend><label><input type="checkbox" data-library-category="sexy" checked>性感女性</label><label><input type="checkbox" data-library-category="closeup" checked>女生特写（上半身）</label><button id="libraryAllCategories" type="button">全部类别</button></fieldset>
        <label>标注状态<select id="libraryLabel"><option value="all">全部状态</option><option value="like">Like</option><option value="unlike">Unlike</option><option value="unlabeled">未标注</option></select></label>
        <label>开始时间<input id="libraryFrom" type="date"></label>
        <label>结束时间<input id="libraryTo" type="date"></label>
        <label>排序<select id="librarySort"><option value="newest">最新优先</option><option value="oldest">最早优先</option></select></label>
        <button id="libraryReset" class="library-reset" type="button">重置筛选</button>
      </div>
    </section>
    <div class="library-results-bar"><span id="libraryResultCount">正在读取图片…</span><span id="libraryPageInfo"></span></div>
    <section id="libraryGrid" class="library-grid" aria-live="polite"><div class="library-empty">正在读取图片库…</div></section>
    <nav id="libraryPager" class="library-pager" aria-label="图片库分页" hidden><button id="libraryPrev" type="button" aria-label="上一页">←</button><span id="libraryPagerText"></span><button id="libraryNext" type="button" aria-label="下一页">→</button></nav>
  </main>
  <dialog id="libraryPreview" class="library-preview" aria-label="图片预览">
    <div class="library-preview-panel">
      <div class="library-preview-head"><span>图片预览</span><div><a id="libraryPreviewDownload" class="library-preview-download" href="#" download><i data-lucide="download"></i>下载图片</a><button id="libraryPreviewClose" type="button" aria-label="关闭预览">×</button></div></div>
      <img id="libraryPreviewImage" alt="放大预览">
      <p id="libraryPreviewPrompt"></p>
    </div>
  </dialog>
  <script src="static/library.js"></script>
  <script src="../ui-framework.js"></script>
</body>
</html>
