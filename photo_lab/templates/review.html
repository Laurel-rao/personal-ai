<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图片标注 · Photo Lab</title>
  <base href="/photo/">
  <link rel="stylesheet" href="static/app.css">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../ui-framework.css">
  <link rel="stylesheet" href="static/embed.css">
  <link rel="stylesheet" href="static/review.css">
</head>
<body data-page="review" class="review-body{% if embedded %} embedded{% endif %}">
  <header class="page-heading" data-page-heading><div class="page-heading-actions"><div class="review-summary"><span id="reviewQueueCount" class="ui-badge" aria-live="polite">生成队列 0</span><span id="reviewSummary">加载图片库…</span></div></div></header>
  <main class="review-workspace">
    <section class="review-stage" id="reviewStage">
      <div class="review-image-wrap" id="reviewImageWrap"><div class="review-empty">正在加载待标注图片...</div></div>
      <div class="swipe-indicator unlike-indicator" id="unlikeIndicator">UNLIKE</div>
      <div class="swipe-indicator like-indicator" id="likeIndicator">LIKE</div>
    </section>
    <aside class="review-controls">
      <div class="scope-switch" aria-label="图片范围"><button class="scope-button active" data-scope="pending">待标注</button><button class="scope-button" data-scope="all">全部记录</button></div>
      <div class="category-filter" aria-label="类别筛选">
        <div class="category-filter-head"><span>类别筛选</span><button id="categoryAll" type="button">全部类别</button></div>
        <label><input type="checkbox" data-category-filter="sexy" checked><span>性感女性</span></label>
        <label><input type="checkbox" data-category-filter="closeup" checked><span>女生特写（上半身）</span></label>
      </div>
      <div class="mode-switch" aria-label="浏览模式"><button class="mode-button active" data-mode="sequential">顺序</button><button class="mode-button" data-mode="random">随机</button></div>
      <button id="playButton" class="play-button">开始自动浏览</button>
      <div class="label-actions">
        <button id="unlikeButton" class="label-button unlike" title="左键">← <span>Unlike</span></button>
        <button id="likeButton" class="label-button like" title="右键"><span>Like</span> →</button>
      </div>
      <div class="nav-actions"><button id="previousButton" class="nav-button">↑ 上一张</button><button id="nextButton" class="nav-button">下一张 ↓</button></div>
      <div class="review-caption">
        <div class="review-caption-copy"><div class="review-caption-meta"><span class="eyebrow" id="reviewSource">PHOTO LAB</span><span class="review-image-number" id="reviewImageNumber">编号</span></div><p id="reviewPrompt">图片生成后会自动进入此处。</p><div class="review-caption-actions"><button id="reviewCopyPrompt" class="review-copy-button" type="button" disabled><i data-lucide="copy"></i><span>复制提示词</span></button><a id="reviewDownloadImage" class="review-copy-button review-download-button" href="#" download hidden><i data-lucide="download"></i><span>下载图片</span></a></div></div>
        <div class="review-position" id="reviewPosition">0 / 0</div>
      </div>
      <div class="shortcut-help"><span><kbd>←</kbd><kbd>→</kbd> 标注并下一张</span><span><kbd>↑</kbd><kbd>↓</kbd> 浏览</span><span><kbd>Space</kbd> 自动浏览</span><span class="mobile-help">手机：左右滑动标注，上下滑动浏览</span></div>
    </aside>
  </main>
  <script src="static/review.js"></script><script src="../ui-framework.js"></script>
</body>
</html>
