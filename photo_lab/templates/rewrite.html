<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>记忆仿写任务 · Photo Lab</title>
  <base href="/photo/">
  <link rel="stylesheet" href="static/app.css">
  <link rel="stylesheet" href="../ui-framework.css">
</head>
<body data-page="rewrite">
  <main class="rewrite-page">
    <header class="page-heading" data-page-heading><div class="page-heading-actions"><span class="ui-badge"><i class="fa fa-shield-halved" aria-hidden="true"></i> 共享记忆管理</span></div></header>
    <section class="panel rewrite-panel">
      <div class="rewrite-header">
        <div><div class="eyebrow">REWRITE / 04</div><h2>类别任务</h2></div>
        <span class="rewrite-state"><i></i><b>独立任务控制</b></span>
      </div>
      <div class="rewrite-task-grid">
        <article class="rewrite-task-card" data-category="sexy">
          <div class="rewrite-header"><div><div class="eyebrow">CATEGORY / 01</div><h3>性感女性</h3></div><span class="rewrite-state"><i></i><b data-status>空闲</b></span></div>
          <p class="rewrite-memory" data-memory>类别记忆：加载中</p>
          <div class="rewrite-toolbar">
            <label>上下文窗口 <span>TOKEN</span><input data-field="ctx" type="number" min="1024" step="1024" value="32768"></label>
            <label>每批生成 <span>条</span><input data-field="batch" type="number" min="1" max="30" value="5"></label>
            <label>记忆触发 <span>张</span><input data-field="every" type="number" min="1" value="40"></label>
            <label>每条出图 <span>张</span><input data-field="image-batch" type="number" min="1" max="8" value="2"></label>
            <div class="rewrite-actions"><button data-action class="rewrite-start" type="button"><span>启动任务</span><b>→</b></button></div>
          </div>
          <label class="rewrite-extra-label">提示词补充 <span>可选</span><textarea data-field="extra" rows="2" placeholder="补充性感女性的创作方向"></textarea></label>
          <div class="rewrite-log-head"><span>性感女性 · 运行日志</span><small>实时</small></div>
          <pre data-logs class="rewrite-logs">暂无日志</pre>
          <details class="rewrite-memory-details"><summary>展开查看类别记忆</summary><p data-memory-text>加载中</p></details>
        </article>
        <article class="rewrite-task-card" data-category="closeup">
          <div class="rewrite-header"><div><div class="eyebrow">CATEGORY / 02</div><h3>女生特写（上半身）</h3></div><span class="rewrite-state"><i></i><b data-status>空闲</b></span></div>
          <p class="rewrite-memory" data-memory>类别记忆：加载中</p>
          <div class="rewrite-toolbar">
            <label>上下文窗口 <span>TOKEN</span><input data-field="ctx" type="number" min="1024" step="1024" value="32768"></label>
            <label>每批生成 <span>条</span><input data-field="batch" type="number" min="1" max="30" value="5"></label>
            <label>记忆触发 <span>张</span><input data-field="every" type="number" min="1" value="40"></label>
            <label>每条出图 <span>张</span><input data-field="image-batch" type="number" min="1" max="8" value="2"></label>
            <div class="rewrite-actions"><button data-action class="rewrite-start" type="button"><span>启动任务</span><b>→</b></button></div>
          </div>
          <label class="rewrite-extra-label">提示词补充 <span>可选</span><textarea data-field="extra" rows="2" placeholder="补充美女人脸和上半身构图方向"></textarea></label>
          <div class="rewrite-log-head"><span>女生特写 · 运行日志</span><small>实时</small></div>
          <pre data-logs class="rewrite-logs">暂无日志</pre>
          <details class="rewrite-memory-details"><summary>展开查看类别记忆</summary><p data-memory-text>加载中</p></details>
        </article>
      </div>
    </section>
  </main>
  <script src="static/rewrite.js"></script>
  <script src="../ui-framework.js"></script>
</body>
</html>
