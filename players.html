    .pl-search-meta .seed { color: #0f9d58; }
    .pl-search-actions { display: flex; gap: 6px; }
    .pl-search-actions button, .pl-search-actions a { border: 1px solid var(--page-line, #e3e9ee); background: var(--page-surface, #fff); color: var(--page-text, #243242); border-radius: 7px; padding: 5px 10px; font-size: 11.5px; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .pl-search-actions button.primary { background: var(--page-primary, #087f65); border: 0; color: #fff; }
    .pl-book-cover { width: 44px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 5px; border: 1px solid var(--page-line, #e3e9ee); background: #f3f6f8; flex: 0 0 44px; }
    .pl-book-cover-empty { display: block; }
    .pl-search-loading { padding: 28px 0; text-align: center; color: var(--page-muted, #7b8795); font-size: 12.5px; }
</style>
</head>
<body data-page="idols">
  <div class="pl-wrap">
    <header class="pl-head">
      <div>
        <div class="pl-eyebrow">JSL · 选手资料库</div>
        <h1 class="pl-title">选手库</h1>
        <p class="pl-sub">卡牌评分、档案资料、标签与评论，一处查看。</p>
      </div>
    </header>

    <div class="pl-toolbar">
      <input id="plQuery" placeholder="搜索名字（中文 / 日文 / 罗马字）" aria-label="搜索选手" />
      <select id="plSort" aria-label="排序方式">
        <option value="FAC" selected>颜值 FAC</option>
        <option value="overall">总评</option>
        <option value="BDY">身材 BDY</option>
        <option value="SKL">技巧 SKL</option>
        <option value="POP">人气 POP</option>
        <option value="CHA">魅力 CHA</option>
        <option value="PRF">表现 PRF</option>
        <option value="height">身高</option>
        <option value="bust">胸围</option>
        <option value="followers">粉丝数</option>
        <option value="debut">出道年份</option>
        <option value="age">年龄</option>
      </select>
      <select id="plOrder" aria-label="排序方向">
        <option value="desc">从高到低</option>
        <option value="asc">从低到高</option>
      </select>
      <select id="plStudio" aria-label="厂牌筛选"><option value="">全部厂牌</option></select>
      <button type="button" class="pl-add" id="plAdd">＋ 添加选手</button>
      <span class="pl-count" id="plCount"></span>
    </div>
    <div class="pl-dl-banner" id="plDlBanner" hidden></div>

    <div class="pl-grid" id="plGrid"><div class="pl-empty">加载中…</div></div>
    <div class="pl-more"><button id="plMore" type="button" hidden>加载更多</button></div>
  </div>


  <div class="pl-lb" id="plLightbox" hidden role="dialog" aria-modal="true" aria-label="图片查看">
    <div class="pl-lb-stage" id="plLbStage">
      <img id="plLbImg" alt="" />
      <div class="pl-lb-loading" id="plLbLoading" hidden><span class="pl-lb-spinner"></span><span id="plLbLoadingText">加载中…</span></div>
    </div>
    <button class="pl-lb-btn pl-lb-close" id="plLbClose" type="button" aria-label="关闭">×</button>
    <button class="pl-lb-btn pl-lb-prev" id="plLbPrev" type="button" aria-label="上一张">‹</button>
    <button class="pl-lb-btn pl-lb-next" id="plLbNext" type="button" aria-label="下一张">›</button>
    <div class="pl-lb-bar">
      <span class="title" id="plLbTitle"></span>
      <span class="zoom" id="plLbZoom">100%</span>
      <div class="tools">
        <button type="button" id="plLbZoomOut">缩小 −</button>
        <button type="button" id="plLbZoomIn">放大 +</button>
        <button type="button" id="plLbReset">重置</button>
        <a id="plLbDownload" download>下载原图</a>
      </div>
    </div>
  </div>
  <div class="pl-search-overlay" id="plSearchModal" hidden role="dialog" aria-modal="true" aria-label="搜索番号与写真集">
    <div class="pl-search-box">
      <div class="pl-search-head">
        <h3 id="plSearchTitle">搜索</h3>
        <button class="pl-search-close" id="plSearchClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="pl-search-tabs">
        <button type="button" data-tab="code" class="active">番号（影片）</button>
        <button type="button" data-tab="book">写真集</button>
      </div>
      <div id="plSearchPane"></div>
    </div>
  </div>
  <div class="pl-add-overlay" id="plAddModal" hidden role="dialog" aria-modal="true" aria-labelledby="plAddTitle">
    <form class="pl-add-box" id="plAddForm" novalidate>
      <h3 id="plAddTitle">添加选手</h3>
      <p class="pl-add-hint">可先检索 DMM 女优库自动填表；保存前会检查库里是否已有同名选手。</p>
      <div class="pl-add-search">
        <div class="pl-add-search-head"><span>检索选手</span><small>DMM 女优库</small></div>
        <input id="plAddQuery" type="text" autocomplete="off" placeholder="中文 / 日文 / 罗马字，如：小谷アリサ" aria-label="检索选手" />
        <div class="pl-add-results" id="plAddResults" hidden></div>
        <div class="pl-add-picked" id="plAddPicked" hidden></div>
      </div>
      <label>显示名（必填）<input id="plAddName" maxlength="40" required autocomplete="off" placeholder="如：小谷アリサ"></label>
      <label>日文名<input id="plAddJp" maxlength="40" autocomplete="off"></label>
      <label>罗马字<input id="plAddRoman" maxlength="60" autocomplete="off" placeholder="如：Otani Arisa"></label>
      <label>厂牌<input id="plAddStudio" maxlength="40" autocomplete="off"></label>
      <label>备注<input id="plAddNote" maxlength="500" autocomplete="off"></label>
      <div class="pl-add-grid">
        <label>身高 cm<input id="plAddHeight" maxlength="3" inputmode="numeric" autocomplete="off"></label>
        <label>出道年份<input id="plAddDebut" maxlength="4" inputmode="numeric" autocomplete="off"></label>
        <label>三围<input id="plAddMeasurements" maxlength="60" autocomplete="off" placeholder="B92(H)-W62-H89"></label>
        <label>生日<input id="plAddBirthday" type="date"></label>
      </div>
      <label>事务所<input id="plAddAgency" maxlength="80" autocomplete="off"></label>
      <label>X / Twitter<input id="plAddSocialX" type="url" maxlength="300" autocomplete="off" placeholder="https://x.com/..."></label>
      <label>Instagram<input id="plAddSocialIg" type="url" maxlength="300" autocomplete="off" placeholder="https://instagram.com/..."></label>
      <label class="pl-add-auto" id="plAddAutoRow"><input id="plAddAuto" type="checkbox" checked>保存后自动下载她的 DMM 写真<small>试读原图</small></label>
      <p class="pl-add-error" id="plAddError" hidden></p>
      <div class="pl-add-actions">
        <button type="button" id="plAddCancel">取消</button>
        <button type="submit" class="primary" id="plAddSave">保存</button>
      </div>
    </form>
  </div>
  <div class="pl-modal" id="plModal" hidden role="dialog" aria-modal="true">
    <button class="pl-close" id="plClose" type="button" aria-label="关闭">×</button>
    <div class="pl-modal-box" id="plModalBox"></div>
  </div>

  <script src="/ui-framework.js"></script>
  <script>
    (function () {
      const grid = document.getElementById('plGrid');
      const query = document.getElementById('plQuery');
      const sortSelect = document.getElementById('plSort');
      const orderSelect = document.getElementById('plOrder');
      const studioSelect = document.getElementById('plStudio');
      const countEl = document.getElementById('plCount');
      const moreBtn = document.getElementById('plMore');
      const modal = document.getElementById('plModal');
      const modalBox = document.getElementById('plModalBox');
      const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      async function readJson(response) {
        if (response.redirected) throw new Error('登录已失效，请刷新页面');
        const text = await response.text();
        try {
          return JSON.parse(text);
        } catch (error) {
          throw new Error(response.ok ? '服务返回了非 JSON 内容' : `加载失败（HTTP ${response.status}）`);
        }
      }


      const PAGE = 60;
      let offset = 0;
      let total = 0;
      let loading = false;
      let items = [];
      const dlBanner = document.getElementById('plDlBanner');
      let dlBannerPoll = 0;
      let detailDownloadPoll = 0;
      let detailDownloadToken = 0;

      function cardHtml(item) {
        const stats = item.stats || {};
        const mini = ['FAC', 'BDY', 'SKL', 'POP', 'CHA', 'PRF']
          .filter((key) => stats[key] != null)
          .map((key) => `<span title="${key}">${stats[key]}</span>`).join('');
        return `
        <article class="pl-card" data-id="${esc(item.id)}">
          <div class="pl-cover">${item.card_image ? `<img loading="lazy" src="${esc(item.card_image)}" alt="${esc(item.name)}">` : ''}${item.local_books ? `<button type="button" class="pl-local-badge" data-local="1" title="本地写真 ${item.local_books} 本 · ${item.local_pages} 张">写真 ${item.local_books}</button>` : ''}${item.group_size > 1 ? `<span class="pl-variant-badge">×${item.group_size}</span>` : ''}</div>
          <div class="pl-name" title="${esc(item.name)}">${esc(item.name)}</div>
          <div class="pl-meta">
            <span class="ov">${item.overall != null ? item.overall : '—'}</span>
            <span>${esc(item.studio || '')}</span>
            ${item.height ? `<span>${item.height}cm</span>` : ''}
            ${item.debut ? `<span>${esc(item.debut)}出道</span>` : ''}
          </div>
          <div class="pl-stats">${mini}</div>
        </article>`;
      }

      async function load(reset) {
        if (loading) return;
        loading = true;
        moreBtn.disabled = true;
        try {
          const params = new URLSearchParams({
            q: query.value.trim(),
            sort: sortSelect.value,
            order: orderSelect.value,
            studio: studioSelect.value,
            limit: PAGE,
            offset: reset ? 0 : offset,
          });
          const response = await fetch(`/api/players/list?${params}`);
          const data = await readJson(response);
          if (!response.ok || !data.success) throw new Error(data.error || '加载失败');
          if (reset) {
            items = [];
            grid.innerHTML = '';
            offset = 0;
            if (studioSelect.options.length <= 1 && data.studios) {
              data.studios.forEach((studio) => {
                const option = document.createElement('option');
                option.value = studio; option.textContent = studio;
                studioSelect.appendChild(option);
              });
            }
          }
          items = items.concat(data.items);
          const html = data.items.map(cardHtml).join('');
          grid.insertAdjacentHTML('beforeend', html || (reset ? '<div class="pl-empty">没有匹配的选手</div>' : ''));
          offset += data.items.length;
          total = data.total;
          countEl.textContent = `${total} 位选手`;
          moreBtn.hidden = offset >= total;
          moreBtn.textContent = '加载更多';
          bindCards();
        } catch (error) {
          countEl.textContent = error.message;
        } finally {
          loading = false;
          moreBtn.disabled = false;
        }
      }

      function bindCards() {
        grid.querySelectorAll('.pl-card').forEach((card) => {
          card.addEventListener('click', () => openDetail(card.dataset.id));
        });
        grid.querySelectorAll('.pl-local-badge').forEach((badge) => {
          badge.addEventListener('click', (event) => {
            event.stopPropagation();
            openLocalPhotos(badge.closest('.pl-card').dataset.id);
          });
        });
      }

      function downloadText(job) {
        const elapsed = job.started_at ? Math.max(0, Math.round(Date.now() / 1000 - job.started_at)) : 0;
        const suffix = elapsed ? ` · ${elapsed}s` : '';
        if (job.phase === 'listing') {
          const where = job.list_pages ? `第 ${job.list_page || 1}/${job.list_pages} 页` : '作品列表';
          return `正在检索作品（${where}）${suffix}`;
        }
        const parts = [`已完成 ${job.finished || 0}/${job.total || 0} 本`, `${job.pages || 0} 张`];
        if (job.page_total) parts.push(`当前页 ${job.page_now || 0}/${job.page_total}`);
        if (job.failed) parts.push(`失败 ${job.failed}`);
        return parts.join(' · ') + suffix;
      }

      function renderDownloadBanner(job) {
        if (!job || !job.status || job.status === 'idle') {
          dlBanner.hidden = true;
          return;
        }
        dlBanner.hidden = false;
        dlBanner.classList.toggle('error', job.status === 'error');
        let text = '';
        if (job.status === 'running') text = `「${job.name}」${downloadText(job)}`;
        else if (job.status === 'done') text = `「${job.name}」写真下载完成：${job.message || ''}${job.errors && job.errors.length ? ` · ${job.errors[0]}` : ''}`;
        else text = `「${job.name}」写真下载失败：${job.message || '未知错误'}${job.errors && job.errors.length ? ` · ${job.errors[0]}` : ''}`;
        dlBanner.innerHTML = `<span>${esc(text)}</span><button type="button" id="plDlHide">${job.status === 'running' ? '隐藏' : '关闭'}</button>`;
        document.getElementById('plDlHide').addEventListener('click', () => {
          clearInterval(dlBannerPoll);
          dlBannerPoll = 0;
          dlBanner.hidden = true;
        });
      }

      function stopBannerPoll() {
        clearInterval(dlBannerPoll);
        dlBannerPoll = 0;
      }

      function stopDetailDownloadPoll() {
        clearInterval(detailDownloadPoll);
        detailDownloadPoll = 0;
      }

      function pollDownloadBanner(cardId, name) {
        stopBannerPoll();
        const tick = async () => {
          try {
            const response = await fetch(`/api/players/download/status?id=${encodeURIComponent(cardId)}`);
            const data = await readJson(response);
            const job = data.job || { status: 'idle' };
            if (!job.name) job.name = name;
            renderDownloadBanner(job);
            if (job.status !== 'running') {
              stopBannerPoll();
              if (job.status === 'done') {
                load(true);
                setTimeout(() => { if (!dlBannerPoll) dlBanner.hidden = true; }, 6000);
              }
            }
          } catch (error) {
            stopBannerPoll();
          }
        };
        tick();
        dlBannerPoll = setInterval(tick, 2000);
      }

      function showDownloadError(name, message) {
        stopBannerPoll();
        renderDownloadBanner({ name, status: 'error', message });
      }

      async function openLocalPhotos(id) {
        detailDownloadToken += 1;
        stopDetailDownloadPoll();
        const item = items.find((entry) => entry.id === id);
        if (!item) return;
        modalBox.innerHTML = `
          <div style="grid-column:1/-1">
            <button class="pl-close" id="plLocalClose" type="button" aria-label="关闭">×</button>
            <h2 class="pl-modal-title">${esc(item.name)} · 本地写真 <small id="plLocalCount" style="font-size:13px;color:#7b8795"></small></h2>
            <div class="pl-photos" id="plLocalPhotos"><div class="loading">加载中…</div></div>
          </div>`;
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        document.getElementById('plLocalClose').addEventListener('click', closeModal);
        const box = document.getElementById('plLocalPhotos');
        try {
          const response = await fetch(`/api/players/photos?id=${encodeURIComponent(id)}&kind=local`);
          const data = await readJson(response);
          if (!data.success) throw new Error(data.error || '加载失败');
          const list = data.photos || [];
          if (!list.length) { box.innerHTML = '<div class="loading">还没有本地写真</div>'; return; }
          document.getElementById('plLocalCount').textContent = `（${list.length} 张）`;
          box.innerHTML = list.map((src, index) => `<a href="${esc(src)}" data-index="${index}" title="第 ${index + 1} 张"><img loading="lazy" src="${esc(src)}?w=420" alt="图片 ${index + 1}"></a>`).join('');
          box.querySelectorAll('a[data-index]').forEach((link) => {
            link.addEventListener('click', (event) => {
              event.preventDefault();
              openLightbox(list.map((src, i) => ({ src: `${src}?w=1200`, name: item.name, file: `${item.name}-${i + 1}.jpg` })), Number(link.dataset.index));
            });
          });
        } catch (error) {
          box.innerHTML = `<div class="loading">${esc(error.message)}</div>`;
        }
      }

      function cleanMeasurements(text, height) {
        const value = String(text || '');
        if (!value.trim()) return '—';
        const bust = value.match(/B\s*\d+(?:\([^)]*\))?/i);
        const waist = value.match(/W\s*\d+/i);
        const hip = value.match(/H\s*\d+/i);
        if (bust || waist || hip) {
          return [bust && bust[0], waist && waist[0], hip && hip[0]]
            .filter(Boolean).map((part) => part.replace(/\s+/g, '')).join('-');
        }
        return value.replace(/^T?\d{2,3}\s*(cm)?\s*/i, '').trim() || '—';
      }

      async function openDetail(id) {
        const downloadToken = ++detailDownloadToken;
        stopDetailDownloadPoll();
        modalBox.innerHTML = '<div style="padding:30px;color:#8b93a7">加载中…</div>';
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        try {
          const response = await fetch(`/api/players/detail?id=${encodeURIComponent(id)}`);
          const data = await readJson(response);
          if (!response.ok || !data.success) throw new Error(data.error || '加载失败');
          const item = data.item;
          const variants = data.variants || [];
          const stats = item.stats || {};
          const statKeys = ['FAC', 'BDY', 'SKL', 'POP', 'CHA', 'PRF'];
          const statCards = statKeys.filter((key) => stats[key] != null).map((key) => `
            <div class="pl-stat"><div class="pl-stat-label">${key}</div><div class="pl-stat-value">${stats[key]}</div>
              <div class="pl-stat-bar"><i style="width:${Math.min(100, stats[key])}%"></i></div></div>`).join('');
          const variantStrip = variants.length > 1 ? `
            <div class="pl-variants">${variants.map((v, i) => `<img class="${i === 0 ? 'active' : ''}" src="${esc(v.card_image)}" data-variant="${i}" alt="变体 ${v.variant || i + 1}" title="变体 ${v.variant || i + 1} · 总评 ${v.overall ?? '—'}">`).join('')}</div>` : '';
          const tags = (data.tags || []).map((tag) => `<span>${esc(tag)}</span>`).join('') || '<span style="background:none;color:#8b93a7">暂无标签</span>';
          const comments = (data.comments || []).slice(0, 20).map((comment) => `
            <div class="pl-comment"><b>${esc(comment.author || '匿名')}</b><small>${esc((comment.createdAt || '').slice(0, 10))}</small><div>${esc(comment.body || '')}</div></div>`).join('') || '<div class="pl-comment" style="color:#8b93a7">暂无评论</div>';
          const socials = [];
          if (item.social?.x) socials.push(`<a href="${esc(item.social.x)}" target="_blank" rel="noopener">X / Twitter</a>`);
          if (item.social?.instagram) socials.push(`<a href="${esc(item.social.instagram)}" target="_blank" rel="noopener">Instagram</a>`);
          modalBox.innerHTML = `
            <div class="pl-modal-left">
              ${item.card_image ? `<img class="pl-modal-img" id="plModalImg" src="${esc(item.card_image)}" alt="${esc(item.name)}">` : `<div class="pl-modal-img pl-noimg">${esc(item.name)}</div>`}
              ${variantStrip}
            </div>
            <div>
              <button class="pl-close" id="plClose2" type="button" aria-label="关闭">×</button>
              <div class="pl-title-row">
                <h2 class="pl-modal-title">${esc(item.name)}</h2>
                <div class="pl-title-chips">
                  <span>总评 ${item.overall ?? '—'}</span>
                  ${item.studio ? `<span>${esc(item.studio)}</span>` : ''}
                  ${item.position ? `<span>${esc(item.position)}</span>` : ''}
                  ${item.height ? `<span>${item.height}cm</span>` : ''}
                </div>
                <button class="pl-photo-refresh" id="plDownloadBtn" type="button" style="margin-left:auto">下载写真</button>
                ${item.custom ? `<button class="pl-photo-refresh" id="plEditBtn" type="button">编辑资料</button>` : ''}
                <button class="pl-photo-refresh" id="plSearchBtn" type="button">搜索番号 / 写真集</button>
              </div>
              <p class="pl-modal-sub" id="plModalSub">${esc(item.jp_name || '')}${item.ro_name ? ' · ' + esc(item.ro_name) : ''}</p>
              <div class="pl-download-status" id="plDownloadStatus" hidden>
                <div class="pl-download-text" id="plDownloadText"></div>
                <div class="pl-download-bar" id="plDownloadBar" hidden><i id="plDownloadBarFill"></i></div>
              </div>
              <div class="pl-stat-grid" id="plStatsBig">${statCards}</div>
              <dl class="pl-kv">
                <dt>生日</dt><dd>${esc(item.birthday || '—')}${item.age ? `（${item.age} 岁）` : ''}</dd>
                <dt>身高</dt><dd>${item.height ? item.height + ' cm' : '—'}</dd>
                <dt>三围</dt><dd>${esc(cleanMeasurements(item.measurements, item.height))}</dd>
                <dt>事务所</dt><dd>${esc(item.agency || '—')}</dd>
                <dt>出道</dt><dd>${esc(item.debut || '—')}</dd>
                <dt>粉丝</dt><dd>${item.followers ? Number(item.followers).toLocaleString() : '—'}</dd>
                <dt>厂牌/所属</dt><dd>${esc(item.studio || '—')}${item.club ? ' / ' + esc(item.club) : ''}</dd>
                ${item.dmm_id ? `<dt>DMM</dt><dd class="pl-links"><a href="https://video.dmm.co.jp/av/list/?actress=${encodeURIComponent(item.dmm_id)}" target="_blank" rel="noopener">女優名鑑 #${esc(item.dmm_id)}</a></dd>` : ''}
                ${socials.length ? `<dt>社媒</dt><dd class="pl-links">${socials.join('')}</dd>` : ''}
              </dl>
              <div class="pl-section-title">图片 <small id="plPhotoCount"></small>
                <span class="pl-photo-tabs"><button type="button" data-kind="stills" class="active">剧照</button><button type="button" data-kind="daily">日常照</button><button type="button" data-kind="local">本地写真</button></span>
                <button class="pl-photo-refresh" id="plPhotoRefresh" type="button">换一批</button>
              </div>
              <div class="pl-photos" id="plPhotos"><div class="loading">正在抓取写真图（首次约 10-20 秒）…</div></div>
              <div class="pl-section-title">标签</div>
              <div class="pl-chips">${tags}</div>
              <div class="pl-section-title">评论 <small>${(data.comments || []).length} 条</small></div>
              ${comments}
            </div>`;

          let photoKind = 'stills';
          const loadPhotos = async (refresh, kind) => {
            const box = document.getElementById('plPhotos');
            const counter = document.getElementById('plPhotoCount');
            if (!box) return;
            const targetKind = kind || photoKind || 'stills';
            photoKind = targetKind;
            box.innerHTML = `<div class="loading">正在抓取${targetKind === 'daily' ? '日常照' : '剧照'}（首次约 10-40 秒）…</div>`;
            try {
              const response = await fetch(`/api/players/photos?id=${encodeURIComponent(item.id)}${refresh ? '&refresh=1' : ''}&kind=${targetKind}`);
              const photos = await readJson(response);
              if (!photos.success) throw new Error(photos.error || '加载失败');
              const list = photos.photos || [];
              if (!list.length) { box.innerHTML = '<div class="loading">暂无写真图</div>'; return; }
              const gridSrc = (src) => (photos.source === 'local' ? `${src}?w=420` : src);
              box.innerHTML = list.map((src, index) => `<a href="${esc(src)}" data-index="${index}" title="查看第 ${index + 1} 张"><img loading="lazy" src="${esc(gridSrc(src))}" alt="图片 ${index + 1}"></a>`).join('');
              box.querySelectorAll('a[data-index]').forEach((link) => {
                link.addEventListener('click', (event) => {
                  event.preventDefault();
                  const heavy = photos.source === 'local';
                  openLightbox(list.map((src, i) => ({
                    src: heavy ? `${src}?w=1200` : src,
                    name: item.name,
                    file: `${item.name || 'photo'}-${i + 1}.jpg`,
                  })), Number(link.dataset.index));
                });
              });
              const sourceLabel = photos.source === 'dmm-stills' ? '官方剧照'
                : photos.source === 'javdatabase-covers' ? '作品封面'
                : photos.source === 'actorbase' ? '日常照'
                : photos.source === 'theidolbase' ? '写真画廊'
                : photos.source === 'local' ? '本地写真集' : '图片';
              if (counter) counter.textContent = `（${list.length} 张 · ${sourceLabel} · 点击看原图）`;
            } catch (error) {
              box.innerHTML = `<div class="loading">${esc(error.message)}</div>`;
            }
          };
          (async () => {
            const box = document.getElementById('plWorks');
            const counter = document.getElementById('plWorkCount');
            if (!box) return;
            try {
              const response = await fetch(`/api/players/works?id=${encodeURIComponent(item.id)}`);
              const data = await readJson(response);
              if (!data.success) throw new Error(data.error || '加载失败');
              const works = data.works || [];
              if (counter) counter.textContent = `（${works.length} 部）`;
              box.innerHTML = works.slice(0, 90).map((work) => `
                <div class="pl-work">
                  <a href="/nya?q=${encodeURIComponent(work.code)}" target="_blank" rel="noopener">${esc(work.code)}</a>
                  <span class="meta">${esc((work.date || '').slice(0, 7))} · ${esc(work.studio || '')}</span>
                </div>`).join('') || '<div class="loading">暂无作品数据</div>';
            } catch (error) {
              box.innerHTML = `<div class="loading">${esc(error.message)}</div>`;
            }
          })();

          document.getElementById('plClose2')?.addEventListener('click', closeModal);
          document.getElementById('plSearchBtn')?.addEventListener('click', () => openSearchModal(item));
          document.getElementById('plEditBtn')?.addEventListener('click', () => openEdit(item, data.profile || {}));
          modalBox.querySelectorAll('.pl-photo-tabs button').forEach((btn) => {
            btn.addEventListener('click', () => {
              modalBox.querySelectorAll('.pl-photo-tabs button').forEach((node) => node.classList.toggle('active', node === btn));
              loadPhotos(false, btn.dataset.kind);
            });
          });
          document.getElementById('plPhotoRefresh')?.addEventListener('click', () => loadPhotos(true));

          modalBox.querySelectorAll('.pl-variants img').forEach((thumb) => {
            thumb.addEventListener('click', () => {
              const index = Number(thumb.dataset.variant);
              const variant = variants[index];
              if (!variant) return;
              modalBox.querySelectorAll('.pl-variants img').forEach((node) => node.classList.toggle('active', node === thumb));
              const img = document.getElementById('plModalImg');
              if (img) img.src = variant.card_image;
            });
          });

          const downloadBtn = document.getElementById('plDownloadBtn');
          const downloadStatus = document.getElementById('plDownloadStatus');
          const downloadTextEl = document.getElementById('plDownloadText');
          const downloadBar = document.getElementById('plDownloadBar');
          const downloadBarFill = document.getElementById('plDownloadBarFill');

          function applyDownloadJob(job) {
            if (downloadToken !== detailDownloadToken || !downloadBtn) return;
            if (job.status === 'running') {
              downloadBtn.disabled = true;
              downloadBtn.textContent = '下载中…';
              downloadStatus.hidden = false;
              downloadStatus.classList.remove('error');
              downloadTextEl.textContent = downloadText(job);
              downloadBar.hidden = false;
              downloadBar.classList.toggle('indeterminate', job.phase === 'listing');
              if (job.phase === 'listing') {
                downloadBarFill.style.width = '';
              } else {
                const percent = job.total ? Math.max(4, Math.min(100, Math.round((job.finished || 0) / job.total * 100))) : 5;
                downloadBarFill.style.width = `${percent}%`;
              }
              if (!detailDownloadPoll) {
                detailDownloadPoll = setInterval(() => refreshDownload(true), 1500);
              }
            } else if (job.status === 'done') {
              downloadBtn.disabled = false;
              downloadBtn.textContent = '继续下载';
              downloadStatus.hidden = false;
              downloadStatus.classList.remove('error');
              downloadTextEl.textContent = `下载完成：${job.message || ''}${job.errors && job.errors.length ? ` · ${job.errors[0]}` : ''}`;
              downloadBar.hidden = false;
              downloadBar.classList.remove('indeterminate');
              downloadBarFill.style.width = '100%';
              stopDetailDownloadPoll();
              const active = modalBox.querySelector('.pl-photo-tabs button.active');
              if (active && active.dataset.kind === 'local') loadPhotos(false, 'local');
            } else if (job.status === 'error') {
              downloadBtn.disabled = false;
              downloadBtn.textContent = '重试下载';
              downloadStatus.hidden = false;
              downloadStatus.classList.add('error');
              downloadTextEl.textContent = `下载失败：${job.message || '未知错误'}${job.errors && job.errors.length ? ` · ${job.errors[0]}` : ''}`;
              downloadBar.hidden = true;
              stopDetailDownloadPoll();
            } else {
              downloadBtn.disabled = false;
              downloadBtn.textContent = '下载写真';
              downloadStatus.hidden = true;
              downloadStatus.classList.remove('error');
              downloadBar.hidden = true;
              stopDetailDownloadPoll();
            }
          }

          async function refreshDownload(silent) {
            if (downloadToken !== detailDownloadToken) return;
            try {
              const response = await fetch(`/api/players/download/status?id=${encodeURIComponent(item.id)}`);
              const data = await readJson(response);
              if (downloadToken !== detailDownloadToken) return;
              applyDownloadJob(data.job || { status: 'idle' });
            } catch (error) {
              if (silent || downloadToken !== detailDownloadToken) return;
              downloadStatus.hidden = false;
              downloadStatus.classList.add('error');
              downloadTextEl.textContent = error.message;
              downloadBar.hidden = true;
            }
          }

          downloadBtn?.addEventListener('click', async () => {
            downloadBtn.disabled = true;
            downloadBtn.textContent = '启动中…';
            downloadStatus.hidden = true;
            try {
              const response = await fetch('/api/players/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: item.id }),
              });
              const data = await readJson(response);
              if (!response.ok || !data.success) throw new Error(data.error || '启动下载失败');
              if (downloadToken !== detailDownloadToken) return;
              applyDownloadJob(data.job || { status: 'running', name: item.name, phase: 'listing' });
            } catch (error) {
              if (downloadToken !== detailDownloadToken) return;
              downloadBtn.disabled = false;
              downloadBtn.textContent = '下载写真';
              downloadStatus.hidden = false;
              downloadStatus.classList.add('error');
              downloadTextEl.textContent = error.message;
              downloadBar.hidden = true;
            }
          });
          refreshDownload(true);
          loadPhotos(false);
        } catch (error) {
          modalBox.innerHTML = `<div style="padding:30px;color:#ff9b9b">${esc(error.message)}</div>`;
        }
      }

      // ---------------- 图片灯箱 ----------------
      const lb = document.getElementById('plLightbox');
      const lbStage = document.getElementById('plLbStage');
      const lbImg = document.getElementById('plLbImg');
      const lbTitle = document.getElementById('plLbTitle');
      const lbZoom = document.getElementById('plLbZoom');
      const lbDownload = document.getElementById('plLbDownload');
      const lbLoading = document.getElementById('plLbLoading');
      const lbLoadingText = document.getElementById('plLbLoadingText');
      let lbToken = 0;
      let lbList = [];
      let lbIndex = 0;
      let lbScale = 1;
      let lbX = 0;
      let lbY = 0;
      let lbDragging = false;
      let lbStartX = 0;
      let lbStartY = 0;

      function lbApply() {
        lbImg.style.transform = `translate(${lbX}px, ${lbY}px) scale(${lbScale})`;
        lbZoom.textContent = `${Math.round(lbScale * 100)}%`;
      }

      function lbShow() {
        if (!lbList.length) return;
        const entry = lbList[lbIndex];
        lbLoading.hidden = false;
        lbLoadingText.textContent = '加载中…';
        lbImg.style.opacity = '0';
        const token = ++lbToken;
        lbImg.onload = () => {
          if (token !== lbToken) return;
          lbImg.style.opacity = '1';
          lbLoading.hidden = true;
        };
        lbImg.onerror = () => {
          if (token !== lbToken) return;
          lbLoadingText.textContent = '加载失败，点击图片重试';
        };
        lbImg.onclick = () => {
          lbImg.src = entry.src + (entry.src.includes('?') ? '&' : '?') + '_=' + Date.now();
        };
        const stamp = Date.now();
        lbImg.src = `${entry.src}${entry.src.includes('?') ? '&' : '?'}_t=${stamp}`;
        lbImg.alt = entry.name || '';
        lbTitle.textContent = `${entry.name || ''}（${lbIndex + 1} / ${lbList.length}）`;
        lbDownload.href = entry.src;
        lbDownload.download = entry.file || 'image.jpg';
        lbScale = 1; lbX = 0; lbY = 0;
        lbApply();
        // 预加载相邻两张，切页更顺
        [1, -1].forEach((delta) => {
          const neighbor = lbList[(lbIndex + delta + lbList.length) % lbList.length];
          if (neighbor && neighbor.src !== entry.src) { const pre = new Image(); pre.src = neighbor.src; }
        });
        const single = lbList.length <= 1;
        document.getElementById('plLbPrev').style.display = single ? 'none' : '';
        document.getElementById('plLbNext').style.display = single ? 'none' : '';
      }

      function openLightbox(list, index) {
        if (!list.length) return;
        lbList = list;
        lbIndex = Math.max(0, Math.min(index, list.length - 1));
        lb.hidden = false;
        document.body.style.overflow = 'hidden';
        lbShow();
      }

      function closeLightbox() {
        lb.hidden = true;
        document.body.style.overflow = '';
        lbImg.style.transform = '';
      }

      function lbStep(delta) {
        if (!lbList.length) return;
        lbIndex = (lbIndex + delta + lbList.length) % lbList.length;
        lbShow();
      }

      function lbSetScale(next) {
        lbScale = Math.max(0.3, Math.min(5, next));
        if (lbScale <= 1) { lbX = 0; lbY = 0; }
        lbApply();
      }

      document.getElementById('plLbClose').addEventListener('click', closeLightbox);
      document.getElementById('plLbPrev').addEventListener('click', () => lbStep(-1));
      document.getElementById('plLbNext').addEventListener('click', () => lbStep(1));
      document.getElementById('plLbZoomIn').addEventListener('click', () => lbSetScale(lbScale * 1.25));
      document.getElementById('plLbZoomOut').addEventListener('click', () => lbSetScale(lbScale / 1.25));
      document.getElementById('plLbReset').addEventListener('click', () => lbSetScale(1));
      lb.addEventListener('click', (event) => {
        if (event.target === lb || event.target === lbStage) closeLightbox();
      });
      lbStage.addEventListener('wheel', (event) => {
        event.preventDefault();
        lbSetScale(lbScale * (event.deltaY < 0 ? 1.15 : 0.87));
      }, { passive: false });
      lbStage.addEventListener('mousedown', (event) => {
        if (lbScale <= 1) return;
        lbDragging = true;
        lbStartX = event.clientX - lbX;
        lbStartY = event.clientY - lbY;
        lbStage.classList.add('dragging');
      });
      window.addEventListener('mousemove', (event) => {
        if (!lbDragging) return;
        lbX = event.clientX - lbStartX;
        lbY = event.clientY - lbStartY;
        lbApply();
      });
      window.addEventListener('mouseup', () => {
        lbDragging = false;
        lbStage.classList.remove('dragging');
      });
      document.addEventListener('keydown', (event) => {
        if (lb.hidden) return;
        if (event.key === 'Escape') closeLightbox();
        else if (event.key === 'ArrowLeft') lbStep(-1);
        else if (event.key === 'ArrowRight') lbStep(1);
        else if (event.key === '+' || event.key === '=') lbSetScale(lbScale * 1.25);
        else if (event.key === '-') lbSetScale(lbScale / 1.25);
        else if (event.key === '0') lbSetScale(1);
      });

      // ---------------- 搜索悬浮窗 ----------------
      const searchModal = document.getElementById('plSearchModal');
      const searchPane = document.getElementById('plSearchPane');
      const searchTitle = document.getElementById('plSearchTitle');
      let searchTabsBound = false;
      let searchContext = null;

      function openSearchModal(item) {
        searchContext = item;
        searchModal.hidden = false;
        document.body.style.overflow = 'hidden';
        searchTitle.textContent = `搜索：${item.name}`;
        loadCodeTab(item);
        searchModal.querySelectorAll('.pl-search-tabs button').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.tab === 'code');
        });
        if (!searchTabsBound) {
          searchTabsBound = true;
          searchModal.querySelectorAll('.pl-search-tabs button').forEach((btn) => {
            btn.addEventListener('click', () => {
              searchModal.querySelectorAll('.pl-search-tabs button').forEach((node) => node.classList.toggle('active', node === btn));
              if (btn.dataset.tab === 'code') loadCodeTab(searchContext);
              else loadBookTab(searchContext);
            });
          });
          document.getElementById('plSearchClose').addEventListener('click', closeSearchModal);
          searchModal.addEventListener('click', (event) => { if (event.target === searchModal) closeSearchModal(); });
        }
      }

      function closeSearchModal() {
        searchModal.hidden = true;
        document.body.style.overflow = '';
      }

      async function loadCodeTab(item) {
        searchPane.innerHTML = '<div class="pl-search-loading">正在搜索番号（sukebei）…</div>';
        const query = item.jp_name || item.ro_name || item.name;
        try {
          const response = await fetch(`/api/nya/search?q=${encodeURIComponent(query)}&source=sukebei`);
          const data = await readJson(response);
          if (!data.success) throw new Error(data.error || '搜索失败');
          const coverOf = (title) => {
            const match = String(title || '').match(/([A-Za-z]{2,6})[-_ ]?0*(\d{2,5})/);
            return match ? `${match[1]}-${match[2]}` : '';
          };
          const coverItems = (data.results || []).map((result) => {
            const code = coverOf(result.title);
            return code ? { src: `/api/nya/cover?code=${encodeURIComponent(code)}&size=full`, name: code, file: `${code}.jpg` } : null;
          }).filter(Boolean);
          const rows = (data.results || []).map((result, index) => {
            const code = coverOf(result.title);
            const cover = code ? `/api/nya/cover?code=${encodeURIComponent(code)}` : '';
            return `
            <div class="pl-search-row">
              <div style="display:flex;gap:10px;align-items:flex-start;min-width:0">
                ${cover ? `<img class="pl-search-cover" loading="lazy" src="${cover}" alt="${esc(code)}" data-cover="${esc(cover)}" data-code="${esc(code)}">` : ''}
                <div style="min-width:0">
                  <div class="pl-search-title">${esc(result.title)}</div>
                  <div class="pl-search-meta"><span>${esc(code || '')}</span><span>${esc(result.size || '—')}</span><span class="seed">做种 ${result.seeders}</span><span>下载 ${result.downloads || result.leechers}</span><span>${esc((result.uploaded_at || '').slice(0, 10))}</span></div>
                </div>
              </div>
              <div class="pl-search-actions">
                <button type="button" class="primary" data-code-download="${index}">送迅雷</button>
                <button type="button" data-code-copy="${index}">磁力</button>
              </div>
            </div>`;
          }).join('');
          searchPane.innerHTML = rows || '<div class="pl-search-loading">没有找到相关番号</div>';
          searchPane.querySelectorAll('img.pl-search-cover').forEach((img) => {
            img.addEventListener('click', () => {
              const idx = coverItems.findIndex((entry) => entry.name === img.dataset.code);
              openLightbox(coverItems, idx >= 0 ? idx : 0);
            });
          });
          searchPane.querySelectorAll('button[data-code-download]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              const result = data.results[Number(btn.dataset.codeDownload)];
              btn.disabled = true; btn.textContent = '发送中…';
              try {
                const response = await fetch('/api/nya/download', {
                  method: 'POST', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(result.view_id ? { view_id: result.view_id, code: '', magnet: result.magnet } : { magnet: result.magnet }),
                });
                const out = await readJson(response);
                if (!response.ok || !out.success) throw new Error(out.error || '失败');
                btn.textContent = '已发送';
              } catch (error) { btn.textContent = '失败'; }
              setTimeout(() => { btn.disabled = false; btn.textContent = '送迅雷'; }, 3000);
            });
          });
          searchPane.querySelectorAll('button[data-code-copy]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              const result = data.results[Number(btn.dataset.codeCopy)];
              if (!result.magnet) return;
              try { await navigator.clipboard.writeText(result.magnet); btn.textContent = '已复制'; } catch (e) { btn.textContent = '失败'; }
              setTimeout(() => { btn.textContent = '磁力'; }, 2000);
            });
          });
        } catch (error) {
          searchPane.innerHTML = `<div class="pl-search-loading">${esc(error.message)}</div>`;
        }
      }

      async function loadBookTab(item) {
        searchPane.innerHTML = '<div class="pl-search-loading">正在检索写真集书目（NDL）…</div>';
        try {
          const response = await fetch(`/api/players/books?name=${encodeURIComponent(item.jp_name || item.name)}`);
          const data = await readJson(response);
          if (!data.success) throw new Error(data.error || '检索失败');
          const rows = (data.books || []).map((book) => `
            <div class="pl-search-row">
              <div style="display:flex;gap:10px;align-items:center;min-width:0">
                ${book.cover ? `<img class="pl-book-cover" loading="lazy" src="${esc(book.cover)}" alt="">` : '<span class="pl-book-cover pl-book-cover-empty"></span>'}
                <div style="min-width:0">
                  <div class="pl-search-title">${esc(book.title)}</div>
                  <div class="pl-search-meta"><span>${esc(book.creator || '')}</span><span>${esc(book.date || '')}</span>${book.isbn ? `<span>ISBN ${esc(book.isbn)}</span>` : ''}</div>
                </div>
              </div>
              <div class="pl-search-actions">${book.link ? `<a href="${esc(book.link)}" target="_blank" rel="noopener">书目</a>` : ''}
                <button type="button" class="js-preview" data-book="${esc(book.title || '')}">预览</button>
                <a href="https://book.dmm.co.jp/search/?search_word=${encodeURIComponent(book.title || '')}" target="_blank" rel="noopener">FANZA</a></div>
            </div>`).join('');
          searchPane.innerHTML = rows || '<div class="pl-search-loading">没有找到写真集书目</div>';
          searchPane.querySelectorAll('button.js-preview').forEach((btn) => {
            btn.addEventListener('click', async () => {
              const original = btn.textContent;
              btn.disabled = true; btn.textContent = '查找中…';
              try {
                const response = await fetch(`/api/players/preview?name=${encodeURIComponent(item.jp_name || item.name)}`);
                const data = await readJson(response);
                if (!data.success) throw new Error(data.error || '失败');
                const images = [];
                (data.previews || []).forEach((group) => {
                  (group.images || []).forEach((url) => images.push({ src: url, name: `${item.name} · ${group.source}`, file: `preview-${images.length + 1}.jpg` }));
                });
                if (!images.length) { btn.textContent = '无预览'; }
                else { openLightbox(images, 0); btn.textContent = `${images.length} 张`; }
              } catch (error) {
                btn.textContent = '失败';
              }
              setTimeout(() => { btn.disabled = false; btn.textContent = original; }, 4000);
            });
          });
        } catch (error) {
          searchPane.innerHTML = `<div class="pl-search-loading">${esc(error.message)}</div>`;
        }
      }

      function closeModal() {
        detailDownloadToken += 1;
        stopDetailDownloadPoll();
        modal.hidden = true;
        document.body.style.overflow = '';
      }

      document.getElementById('plClose').addEventListener('click', closeModal);
      modal.addEventListener('click', (event) => { if (event.target === modal) closeModal(); });
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !modal.hidden) closeModal(); });

      let timer = 0;
      query.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => load(true), 350);
      });
      [sortSelect, orderSelect, studioSelect].forEach((el) => el.addEventListener('change', () => load(true)));
      moreBtn.addEventListener('click', () => load(false));

      const addModal = document.getElementById('plAddModal');
      const addForm = document.getElementById('plAddForm');
      const addError = document.getElementById('plAddError');
      const addName = document.getElementById('plAddName');
      const addSave = document.getElementById('plAddSave');
      const addQuery = document.getElementById('plAddQuery');
      const addResults = document.getElementById('plAddResults');
      const addPicked = document.getElementById('plAddPicked');
      let addSearchTimer = 0;
      let addSearchToken = 0;
      let addChoices = [];
      let addActive = -1;
      let addPickedItem = null;
      let addEditId = null;

      function clearAddPick() {
        addPickedItem = null;
        addPicked.hidden = true;
        addPicked.innerHTML = '';
      }

      function clearAddSearch() {
        clearTimeout(addSearchTimer);
        addSearchToken += 1;
        addChoices = [];
        addActive = -1;
        addQuery.value = '';
        addResults.hidden = true;
        addResults.innerHTML = '';
        clearAddPick();

      function pickAddChoice(index) {
        const item = addChoices[index];
        if (!item) return;
        addPickedItem = item;
        addName.value = item.name;
        document.getElementById('plAddJp').value = item.name;
        document.getElementById('plAddRoman').value = item.roman || '';
        document.getElementById('plAddHeight').value = item.height || '';
        document.getElementById('plAddMeasurements').value = item.measurements || '';
        addResults.hidden = true;
        addActive = -1;
        addPicked.hidden = false;
        addPicked.innerHTML = `${item.image ? `<img src="${esc(item.image)}" alt="">` : ''}
          <span>已匹配 DMM #${esc(item.id)} · ${esc(item.name)}${item.kana ? `（${esc(item.kana)}）` : ''}</span>
          <button type="button" id="plAddClearPick">取消匹配</button>`;
        document.getElementById('plAddClearPick').addEventListener('click', () => {
          clearAddPick();
          addError.hidden = true;
        });
        if (item.in_library) {
          addError.textContent = `库里已有这位选手：${item.existing_name || item.name}`;
          addError.hidden = false;
        } else {
          addError.hidden = true;
        }
      }

      function renderAddResults(queryText) {
        const value = queryText.trim();
        const token = ++addSearchToken;
        addActive = -1;
        if (!value) {
          addResults.hidden = true;
          addResults.innerHTML = '';
          addChoices = [];
          return;
        }
        addResults.hidden = false;
        addResults.innerHTML = '<div class="pl-add-result-state">检索中…</div>';
        fetch(`/api/players/actresses?q=${encodeURIComponent(value)}&limit=20`)
          .then((response) => response.json())
          .then((data) => {
            if (token !== addSearchToken) return;
            if (!data.success) throw new Error(data.error || '检索失败');
            addChoices = data.items || [];
            if (!addChoices.length) {
              addResults.innerHTML = '<div class="pl-add-result-state">DMM 女优库没有匹配结果</div>';
              return;
            }
            addResults.innerHTML = addChoices.map((item, index) => {
              const sub = [item.kana, item.roman, item.height ? `${item.height}cm` : '']
                .filter(Boolean).map(esc).join(' · ') || '—';
              return `
                <button type="button" class="pl-add-result" data-index="${index}">
                  ${item.image ? `<img loading="lazy" src="${esc(item.image)}" alt="">` : '<span class="pl-add-result-cover-empty"></span>'}
                  <span class="pl-add-result-info">
                    <span class="pl-add-result-name">${esc(item.name)}</span>
                    <span class="pl-add-result-sub">${sub}</span>
                  </span>
                  ${item.in_library ? '<span class="pl-add-result-flag">已在库</span>' : ''}
                </button>`;
            }).join('');
            addResults.querySelectorAll('.pl-add-result').forEach((btn) => {
              btn.addEventListener('click', () => pickAddChoice(Number(btn.dataset.index)));
            });
          })
          .catch((error) => {
            if (token !== addSearchToken) return;
            addChoices = [];
            addResults.innerHTML = `<div class="pl-add-result-state">${esc(error.message)}</div>`;
          });
      }

      function moveAddActive(delta) {
        if (addResults.hidden || !addChoices.length) return;
        addActive = (addActive + delta + addChoices.length) % addChoices.length;
        addResults.querySelectorAll('.pl-add-result').forEach((node, index) => {
          node.classList.toggle('active', index === addActive);
        });
        const active = addResults.querySelector('.pl-add-result.active');
        if (active) active.scrollIntoView({ block: 'nearest' });
      }

      addQuery.addEventListener('input', () => {
        clearTimeout(addSearchTimer);
        addSearchTimer = setTimeout(() => renderAddResults(addQuery.value), 260);
      });
      addQuery.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !addResults.hidden) {
          addResults.hidden = true;
          event.stopPropagation();
          return;
        }
        if (event.key === 'Enter') {
          event.preventDefault();
          if (!addResults.hidden && addChoices.length) pickAddChoice(addActive >= 0 ? addActive : 0);
          return;
        }
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          event.preventDefault();
          moveAddActive(event.key === 'ArrowDown' ? 1 : -1);
        }
      });

      function openAdd() {
        addEditId = null;
        addForm.reset();
        addError.hidden = true;
        clearAddSearch();
        document.getElementById('plAddTitle').textContent = '添加选手';
        addSave.textContent = '保存';
        document.getElementById('plAddAutoRow').hidden = false;
        document.querySelector('.pl-add-search').hidden = false;
        addModal.hidden = false;
        addQuery.focus();
      }
      function openEdit(item, profile) {
        addEditId = item.id;
        addForm.reset();
        addError.hidden = true;
        clearAddSearch();
        document.getElementById('plAddTitle').textContent = '编辑资料';
        addSave.textContent = '保存资料';
        document.getElementById('plAddAutoRow').hidden = true;
        document.querySelector('.pl-add-search').hidden = true;
        addName.value = item.name || '';
        document.getElementById('plAddJp').value = item.jp_name || '';
        document.getElementById('plAddRoman').value = item.ro_name || '';
        document.getElementById('plAddStudio').value = item.studio || '';
        document.getElementById('plAddNote').value = (profile && profile.note) || '';
        document.getElementById('plAddHeight').value = item.height || '';
        document.getElementById('plAddMeasurements').value = item.measurements || '';
        document.getElementById('plAddBirthday').value = item.birthday || '';
        document.getElementById('plAddAgency').value = item.agency || '';
        document.getElementById('plAddDebut').value = item.debut || '';
        const social = (profile && profile.social) || {};
        document.getElementById('plAddSocialX').value = social.x || '';
        document.getElementById('plAddSocialIg').value = social.instagram || '';
        addModal.hidden = false;
        addName.focus();
      }
      function closeAdd() { addModal.hidden = true; }
      document.getElementById('plAdd').addEventListener('click', openAdd);
      document.getElementById('plAddCancel').addEventListener('click', closeAdd);
      addModal.addEventListener('click', (event) => { if (event.target === addModal) closeAdd(); });
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !addModal.hidden) closeAdd(); });
      addForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        addError.hidden = true;
        if (!addName.value.trim()) {
          addError.textContent = '请先填写显示名';
          addError.hidden = false;
          return;
        }
        addSave.disabled = true;
        const fields = {
          displayName: addName.value.trim(),
          japaneseName: document.getElementById('plAddJp').value.trim(),
          romanName: document.getElementById('plAddRoman').value.trim(),
          studio: document.getElementById('plAddStudio').value.trim(),
          note: document.getElementById('plAddNote').value.trim(),
          height: document.getElementById('plAddHeight').value.trim(),
          measurements: document.getElementById('plAddMeasurements').value.trim(),
          birthday: document.getElementById('plAddBirthday').value.trim(),
          agency: document.getElementById('plAddAgency').value.trim(),
          debut: document.getElementById('plAddDebut').value.trim(),
          socialX: document.getElementById('plAddSocialX').value.trim(),
          socialInstagram: document.getElementById('plAddSocialIg').value.trim(),
        };
        try {
          if (addEditId) {
            const response = await fetch('/api/players/update', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: addEditId, ...fields }),
            });
            const data = await readJson(response);
            if (!response.ok || !data.success) throw new Error(data.error || '保存失败');
            const editedId = addEditId;
            closeAdd();
            load(true);
            openDetail(editedId);
            return;
          }
          const response = await fetch('/api/players/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ...fields,
              dmmId: addPickedItem ? addPickedItem.id : '',
              image: addPickedItem ? addPickedItem.image : '',
              autoDownload: document.getElementById('plAddAuto').checked,
            }),
          });
          const data = await readJson(response);
          if (!response.ok || !data.success) throw new Error(data.error || '保存失败');
          closeAdd();
          studioSelect.value = '';
          query.value = data.item.name;
          load(true);
          if (data.download) pollDownloadBanner(data.download.id, data.download.name || data.item.name);
          else if (data.download_error) showDownloadError(data.item.name, data.download_error);
        } catch (error) {
          addError.textContent = error.message;
          addError.hidden = false;
        } finally {
          addSave.disabled = false;
        }
      });

      load(true);
    })();
  </script>
</body>
</html>
