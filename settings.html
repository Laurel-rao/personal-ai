<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>设置 · 创作工作台</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ui-framework.css" />
  </head>
  <body data-page="settings">
    <div class="app-shell">
      <header class="page-heading" data-page-heading><div class="page-heading-actions"><span class="ui-badge"><i class="fa fa-lock" aria-hidden="true"></i> 仅管理员可编辑</span></div></header>

      <main class="settings-shell">
        <section class="settings-card">
          <h2>生成引擎</h2>
          <p class="settings-desc">图片生成走 Photo Lab → ComfyUI，视频生成走 AutoDL 的 MiniMax H3 工作流。</p>

          <div class="settings-row">
            <label for="comfyUrl">ComfyUI 地址<small>图片生成引擎，格式 https://host:port</small></label>
            <div class="field">
              <span id="comfyUrls">当前：读取中…</span>
              <input id="comfyUrl" name="comfy_endpoint" type="url" spellcheck="false" autocomplete="url" placeholder="https://u288331-….bjb1.seetacloud.com:8443" />
            </div>
          </div>

          <div class="settings-row">
            <label for="autodlToken">MiniMax 视频生成 Key<small>AutoDL 工作流令牌（AUTODL_ART_TOKEN）</small></label>
            <div class="field">
              <span id="autodlTokenState">尚未配置</span>
              <input id="autodlToken" name="autodl_api_token" type="password" spellcheck="false" autocomplete="new-password" data-lpignore="true" data-1p-ignore placeholder="粘贴 AutoDL Token" />
            </div>
          </div>

          <div class="settings-row">
            <label for="aztKey">Zero 首尾帧 Key<small>可选，AZT_API_KEY，「Zero 生成首尾帧」需要</small></label>
            <div class="field">
              <span id="aztKeyState">尚未配置</span>
              <input id="aztKey" name="azt_api_token" type="password" spellcheck="false" autocomplete="new-password" data-lpignore="true" data-1p-ignore placeholder="粘贴 AZT API Key（可选）" />
            </div>
          </div>

          <p class="settings-hint">
            留空的输入框保持不变；保存后立即生效，无需重启。密钥只写入项目根目录
            <code>.env</code> 文件（600 权限），已加入 .gitignore，不会回显完整内容。
          </p>

          <div class="settings-actions">
            <button class="button button-primary" id="saveButton" type="button">保存设置</button>
            <button class="button button-secondary" id="verifyComfyButton" type="button">测试 ComfyUI</button>
            <button class="button button-secondary" id="verifyVideoButton" type="button">测试视频服务</button>
            <span class="settings-status" id="settingsStatus" role="status"></span>
          </div>
        </section>

        <section class="settings-card">
          <h2>当前生效值</h2>
          <p class="settings-desc">以下为服务进程实际使用的配置（环境变量优先于 .env）。</p>
          <div class="settings-row">
            <label>ComfyUI 地址</label>
            <div class="field"><input id="effectiveComfyUrl" type="text" aria-label="当前 ComfyUI 地址" readonly /></div>
          </div>
          <div class="settings-row">
            <label>视频生成 Key</label>
            <div class="field"><input id="effectiveAutodlToken" type="text" aria-label="当前视频生成 Key 状态" readonly /></div>
          </div>
          <div class="settings-row">
            <label>首尾帧 Key</label>
            <div class="field"><input id="effectiveAztKey" type="text" aria-label="当前首尾帧 Key 状态" readonly /></div>
          </div>
        </section>
      </main>
    </div>
    <script src="/settings.js"></script><script src="/ui-framework.js"></script>
  </body>
</html>
